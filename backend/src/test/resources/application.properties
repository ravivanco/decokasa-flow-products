# Configuración solo para las pruebas automáticas. Este secreto JWT es de prueba, sin uso fuera de las pruebas;
# los entornos reales usan JWT_SECRETO (ADR-0015).
decokasa.jwt.secreto=secreto-de-prueba-solo-para-pruebas-automaticas-0123456789
# BCrypt más rápido en las pruebas; la aplicación usa fuerza 12.
decokasa.bcrypt.fuerza=4
