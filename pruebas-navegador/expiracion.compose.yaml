# Solo pruebas: mismo artefacto de producción y base existente; duraciones reducidas, puertos propios.
# Usar junto a docker-compose.yml y a la corrección local del puerto 8080, si hace falta.
services:
  backend-expiracion:
    extends:
      file: docker-compose.yml
      service: backend
    container_name: decokasa-b2-expiracion-backend
    ports: !override
      - "127.0.0.1:18081:8080"
    environment:
      JWT_DURACION_ACCESO: 3s
      JWT_DURACION_RENOVACION: 120s
      CORS_ORIGENES: http://localhost:3001
      SEMILLA_HABILITADA: "false"
  frontend-expiracion:
    extends:
      file: docker-compose.yml
      service: frontend
    container_name: decokasa-b2-expiracion-frontend
    ports: !override
      - "127.0.0.1:3001:80"
    volumes:
      - ./pruebas-navegador/expiracion.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-expiracion:
        condition: service_healthy
