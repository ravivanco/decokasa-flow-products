// Arnés suplementario 3.B1. NO cambia ni sustituye test/check oficiales.
// Compila fuentes originales de todos los módulos salvo notificaciones,
// bloqueado por el constructor inexistente de MapSqlParameterSource (B1-P01).
// No transforma, copia corregida ni sustituye fuentes de producción.
allprojects {
    plugins.withId('java') {
        def produccion = sourceSets.create('archivosB1Main') {
            java.srcDir 'src/main/java'
            java.exclude 'com/decokasa/seguimiento/notificaciones/**'
            resources.srcDir 'src/main/resources'
        }
        def pruebas = sourceSets.create('archivosB1Test') {
            java.srcDir 'src/test/java'
            java.include 'com/decokasa/seguimiento/archivos/**'
            java.include 'com/decokasa/seguimiento/TestcontainersConfiguration.java'
            resources.srcDir 'src/test/resources'
        }
        configurations.archivosB1MainImplementation.extendsFrom configurations.implementation
        configurations.archivosB1MainRuntimeOnly.extendsFrom configurations.runtimeOnly
        configurations.archivosB1TestImplementation.extendsFrom configurations.testImplementation
        configurations.archivosB1TestRuntimeOnly.extendsFrom configurations.testRuntimeOnly
        dependencies.add('archivosB1TestImplementation', produccion.output)
        def ejecutar = tasks.register('archivosB1Aislados', Test) {
            description = 'Evidencia suplementaria de archivos; excluye correo, no reemplaza check.'
            testClassesDirs = pruebas.output.classesDirs
            classpath = pruebas.runtimeClasspath
            useJUnitPlatform()
            systemProperty 'spring.config.import', ''
            systemProperty 'decokasa.google.oauth.habilitada', 'false'
            systemProperty 'decokasa.google.drive.habilitada', 'false'
            systemProperty 'decokasa.google.gmail.habilitada', 'false'
            systemProperty 'decokasa.google.drive.worker.automatico', 'false'
            systemProperty 'decokasa.google.gmail.worker.automatico', 'false'
            maxParallelForks = 1
            maxHeapSize = '768m'
            reports.junitXml.required = true
            reports.html.required = true
        }
        def cobertura = tasks.register('archivosB1Cobertura', JacocoReport) {
            dependsOn ejecutar
            executionData ejecutar.get()
            sourceDirectories.from file('src/main/java')
            classDirectories.from produccion.output.classesDirs.asFileTree.matching {
                include 'com/decokasa/seguimiento/archivos/**'
            }
            reports.xml.required = true
            reports.html.required = true
        }
        ejecutar.configure { finalizedBy cobertura }
    }
}
