allprojects { p ->
 p.plugins.withId('java') {
  def base = new File(p.projectDir, '../documentos/pruebas/fase-6-evidencias/6.B2')
  def s = p.sourceSets.create('verificacionF6B2') {
   java.srcDir(new File(base, 'java'))
   compileClasspath = p.sourceSets.main.output + p.configurations.testRuntimeClasspath
   runtimeClasspath = output + compileClasspath
  }
  p.tasks.register('fase6B2', JavaExec) {
   dependsOn s.classesTaskName
   classpath = s.runtimeClasspath
   mainClass = 'com.decokasa.b2.ArnesF6B2'
   args base.absolutePath
  }
 }
}
