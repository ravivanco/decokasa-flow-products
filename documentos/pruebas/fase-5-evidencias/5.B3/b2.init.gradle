allprojects { p ->
 p.plugins.withId('java') {
  def base = new File(p.projectDir, '../documentos/pruebas/fase-5-evidencias/5.B3')
  def s = p.sourceSets.create('verificacionB2') {
   java.srcDir(new File(base, 'java'))
   compileClasspath = p.sourceSets.main.output + p.configurations.testRuntimeClasspath
   runtimeClasspath = output + compileClasspath
  }
  p.tasks.register('f5B3', JavaExec) {
   dependsOn s.classesTaskName
   classpath = s.runtimeClasspath
   mainClass = 'com.decokasa.b2.ArnesB2'
   args base.absolutePath
  }
  p.tasks.named('test') {
   dependsOn s.classesTaskName
   classpath += s.output + p.files(new File(base,'recursos'))
   systemProperty 'b3.conteos', new File(base,'conteos-backend.jsonl').absolutePath
  }
 }
}
