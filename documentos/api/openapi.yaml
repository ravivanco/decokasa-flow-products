          application/json:
            schema:
              $ref: '#/components/schemas/NuevaTarifaAsistente'
      responses:
        '201':
          description: Tarifa registrada, sin validar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaAsistente'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: DUPLICADO (ya hay una tarifa de ese modelo para esa fecha).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /asistente/tarifas/{tarifaId}/validacion:
    parameters:
      - name: tarifaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [asistente]
      operationId: validarTarifaAsistente
      summary: Validar una tarifa contra su fuente oficial (solo admin)
      x-origen: decision-equipo
      x-roles: [admin]
      description: Solo una vez; después la tarifa no cambia ni se borra.
      responses:
        '200':
          description: Tarifa validada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaAsistente'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /asistente/configuracion:
    get:
      tags: [asistente]
      operationId: obtenerConfiguracionAsistente
      summary: Estado del asistente y límites vigentes (solo admin)
      x-origen: decision-equipo
      x-roles: [admin]
      description: Sin la clave ni detalles del proveedor. `disponible` es true solo si todos los controles están presentes.
      responses:
        '200':
          description: Estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionAsistente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    patch:
      tags: [asistente]
      operationId: cambiarConfiguracionAsistente
      summary: Activar o desactivar el asistente en la base (solo admin)
      x-origen: decision-equipo
      x-roles: [admin]
      description: |
        Tras el apagado automático por límite de gasto, lo reactiva un admin (ADR-0022). Activar exige la tarifa vigente
        del modelo validada. No cambia `IA_HABILITADA` ni los límites de F7-D2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [habilitada, version]
              additionalProperties: false
              properties:
                habilitada:
                  type: boolean
                version:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionAsistente'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: VERSION_DESACTUALIZADA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /auditoria:
    get:
      tags: [historial]
      operationId: consultarAuditoriaGlobal
      summary: Historial de todos los pedidos (solo admin)
      x-origen: requisito
      x-roles: [admin]
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: usuarioId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEventos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /notificaciones:
    get:
      tags: [notificaciones]
      operationId: consultarNotificaciones
      summary: Correos enviados, pendientes y fallidos (solo admin)
      x-origen: requisito
      x-roles: [admin]
      description: |
        Requisitos 4.2 #16 y 4.8 (registro de correos enviados y fallidos). Reemplaza la vista de Gmail del demo. Desde
        0.17.0 (ADR-0024): solo correos de pedidos de los países asignados hoy al admin; `elementos` y `total` usan el
        mismo filtro en el servidor. No cambia el envío ni los trabajos pendientes.
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoNotificacion'
        - $ref: '#/components/parameters/PaisSeleccionado'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Notificaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaNotificaciones'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ADR-0002. El token lleva el id y los roles del usuario; los permisos se validan siempre en el servidor.

  headers:
    Location:
      description: Ruta del recurso creado.
      schema:
        type: string
        format: uri-reference
    CookieRenovacion:
      description: |
        D3b (ADR-0002, aprobado el 2026-10-12). Cookie `decokasa_renovacion` con el token de renovación:
        `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<segundos hasta el fin de la sesión de 8 h>`.
        Al cerrar sesión se envía vacía con `Max-Age=0`. JavaScript no puede leerla.
      schema:
        type: string

  parameters:
    CookieRenovacion:
      name: decokasa_renovacion
      in: cookie
      required: false
      description: 'D3b (ADR-0002). Token de renovación; lo envía el navegador, nunca JavaScript.'
      schema:
        type: string
    Origen:
      name: Origin
      in: header
      required: true
      description: |
        D3b (ADR-0002). Origen de la página que llama; debe estar en `CORS_ORIGENES` (en desarrollo,
        `http://localhost:3000`). Los navegadores la envían solos. Si falta o no está permitido: 403 `SIN_PERMISO`.
      schema:
        type: string
        format: uri
    PedidoId:
      name: pedidoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NumeroEtapa:
      name: numeroEtapa
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
    ConversacionId:
      name: conversacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaisSeleccionado:
      name: pais
      in: query
      required: false
      description: |
        Paso 7.3 (ADR-0024): país seleccionado en la pantalla. Debe estar asignado hoy a quien consulta; si no, 403.
        Sin él, todos sus países asignados (compatibilidad). En la búsqueda por número, un pedido de otro país responde
        404 aunque esté asignado.
      schema:
        $ref: '#/components/schemas/CodigoPais'
    Pagina:
      name: pagina
      in: query
      description: Página, desde 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Tamano:
      name: tamano
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Validacion:
      description: Datos inválidos (código VALIDACION).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutenticado:
      description: Sin sesión o con el token vencido (código NO_AUTENTICADO).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    SinPermiso:
      description: El usuario no tiene el rol, no está asignado a la etapa o no es admin (código SIN_PERMISO).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: El recurso no existe (código NO_ENCONTRADO).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Conflicto:
      description: |
        Conflicto con el estado actual. Códigos: ETAPA_CAMBIO (la etapa actual no es la esperada),
        TRANSICION_NO_PERMITIDA (la acción no existe en la etapa actual), DUPLICADO (correo, usuario,
        teléfono o nombre ya registrado), ARCHIVO_NO_DISPONIBLE (el archivo falta en el almacenamiento o su huella
        no coincide) o VERSION_DESACTUALIZADA (otra persona cambió el recurso desde que el
        cliente lo leyó; D10). Con DUPLICADO, `errores[0].campo` indica el campo repetido. VERSION_DESACTUALIZADA
        no lleva `errores` y no aplica ningún cambio; si además hubiera un dato repetido, se responde
        VERSION_DESACTUALIZADA.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    LimiteConsumo:
      description: |
        Límite del piloto alcanzado (código LIMITE_CONSUMO): consultas por usuario o diarias, consulta en curso o
        presupuesto del mes. No se llamó al modelo. Puede llevar `Retry-After` cuando el límite es diario.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    IaNoDisponible:
      description: |
        El asistente no está disponible (código IA_NO_DISPONIBLE): desactivado, sin credenciales, sin precio del modelo,
        proveedor caído, tiempo agotado o límite de gasto externo alcanzado. Sin detalles del proveedor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    RequisitoFaltante:
      description: |
        Falta un requisito de la acción (código REQUISITO_FALTANTE): un documento obligatorio,
        la observación, la urgencia o la bodega. `faltantes` indica cuáles.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'

  schemas:
    InicioCarga:
      type: object
      required: [entradaEsperadaId, claveIdempotencia, nombre, tipoDocumento, tamanoBytes]
      properties:
        entradaEsperadaId: { type: string, format: uuid }
        claveIdempotencia: { type: string, format: uuid }
        nombre:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nombre original saneado por la misma política de fase 2, hasta 255 puntos de código; nunca ruta.
        tipoDocumento: { type: string, minLength: 1, maxLength: 100 }
        tamanoBytes: { type: integer, format: int64, minimum: 1, maximum: 104857600 }
    FragmentoCarga:
      type: object
      required: [inicio, tamano, sha256]
      properties:
        inicio: { type: integer, format: int64, minimum: 0 }
        tamano: { type: integer, minimum: 1, maximum: 4194304 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CargaArchivo:
      type: object
      required: [id, pedidoId, etapa, entradaId, nombre, tipoDocumento, tamanoBytes, offsetConfirmado, fragmentoBytes, estado, adjuntoId, eventoId, creadaEn, actualizadaEn, fragmentos]
      properties:
        id: { type: string, format: uuid }
        pedidoId: { type: string, format: uuid }
        etapa: { type: integer, minimum: 1, maximum: 30 }
        entradaId: { type: string, format: uuid }
        nombre: { type: string }
        tipoDocumento: { type: string }
        tamanoBytes: { type: integer, format: int64, minimum: 1, maximum: 104857600 }
        offsetConfirmado: { type: integer, format: int64, minimum: 0, maximum: 104857600 }
        fragmentoBytes: { type: integer, const: 4194304 }
        estado: { type: string, enum: [RECIBIENDO, COMPLETADA] }
        adjuntoId: { type: [string, 'null'], format: uuid }
        eventoId: { type: [string, 'null'], format: uuid }
        creadaEn: { type: string, format: date-time }
        actualizadaEn: { type: string, format: date-time }
        fragmentos:
          type: array
          maxItems: 25
          items: { $ref: '#/components/schemas/FragmentoCarga' }
      description: |
        Caducidad/borrado todavía no acordados: no se inventa fecha ni se eliminan parciales automáticamente.
        RECIBIENDO, incluso con offset total, no es un adjunto válido. Solo COMPLETADA tiene adjunto/evento.
        Los SHA-256 de los bloques permiten comprobar el prefijo al reseleccionar el archivo tras recargar.
    Problema:
      type: object
      description: Error con el formato RFC 9457 (Problem Details), más un código estable para el frontend.
      required: [title, status, codigo]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          enum:
            - VALIDACION
            - NO_AUTENTICADO
            - SIN_PERMISO
            - NO_ENCONTRADO
            - ETAPA_CAMBIO
            - TRANSICION_NO_PERMITIDA
            - DUPLICADO
            - REQUISITO_FALTANTE
            - ARCHIVO_DEMASIADO_GRANDE
            - TIPO_ARCHIVO_NO_ACEPTADO
            - COPIA_PENDIENTE
            - CUENTA_BLOQUEADA
            - VERSION_DESACTUALIZADA
            - ARCHIVO_NO_DISPONIBLE
            - GOOGLE_NO_DISPONIBLE
            - CARGA_CONFLICTO
            - CARGA_INCOMPLETA
            - CARGA_OCUPADA
            - CARGA_ALMACENAMIENTO
            - CUOTA_ALMACENAMIENTO
            - CONTEXTO_EXCEDIDO
            - LIMITE_PREGUNTAS
            - LIMITE_CONSUMO
            - IA_NO_DISPONIBLE
        errores:
          type: array
          description: |
            Errores por campo con VALIDACION, y también con DUPLICADO para indicar qué campo está repetido
            (correo, usuario, telefono o codigo) y que el formulario lo marque (aprobado el 2026-10-12).
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo:
                type: string
              mensaje:
                type: string
        faltantes:
          type: array
          description: Requisitos que faltan (solo con REQUISITO_FALTANTE), por ejemplo "Packing List" o "bodega".
          items:
            type: string

    CodigoPais:
      type: string
      enum: [EC, CO]
      description: 'EC activo; CO inactivo en v1 (ADR-0009).'
    TipoFlujo:
      type: string
      enum: [A, B]
      description: 'A: pedido de Ecuador (productos existentes y nuevos). B: pedido propuesto por China.'
    CodigoRol:
      type: string
      pattern: '^[a-z_]{3,40}$'
      description: 'Código del rol. Los 7 iniciales son admin, asistente_compras, marketing, compras_china, logistica, asistente_china y consulta (este último conservado por decisión del equipo; su alcance está pendiente del cliente). No es una lista cerrada porque el admin puede crear roles (requisito 4.6); el formato es el mismo en la base (`rol.codigo`) y en el dominio (`CodigoRol`).'
      examples: [admin, compras_china]
    NivelUrgencia:
      type: string
      enum: [URGENTE, PRIORITARIO, NORMAL]
      description: 'URGENTE 4 h, PRIORITARIO 12 h, NORMAL 24 h (requisito 4.2 #11). Pendiente: horas hábiles o corridas.'
    AccionEtapa:
      type: string
      enum: [ENVIAR, APROBAR, RECHAZAR, DEVOLVER_POR_ERROR, DEVOLVER_POR_PRODUCTO_NUEVO, REPORTAR_DEMORA, ELEGIR_BODEGA]
    EstadoEtapa:
      type: string
      enum: [PENDIENTE, ACTUAL, COMPLETADA, DEVUELTA]
      description: 'DEVUELTA: la etapa se completó, pero el pedido volvió a una etapa anterior.'
    EstadoCopia:
      type: string
      enum: [PENDIENTE, COPIADO, FALLIDO]
    EstadoNotificacion:
      type: string
      enum: [PENDIENTE, ENVIADA, FALLIDA]
    TipoPlazo:
      type: string
      enum: [HORAS_HABILES, DIAS_HABILES, DIAS_CORRIDOS]
      description: 'Pendiente: el tránsito de 45 días y las urgencias pueden ser hábiles o corridos (ADR-0006).'
    EstadoPlazo:
      type: string
      enum: [DEFINIDO, SIN_PLAZO, PENDIENTE]
      description: 'DEFINIDO: hay `plazo`. SIN_PLAZO: la etapa no tiene plazo (A1, Fin). PENDIENTE: el cliente no lo definió; nunca equivale a "sin plazo" ni genera vencimiento.'
    RequisitosDocumentales:
      type: string
      enum: [DEFINIDOS, PENDIENTES]
      description: 'DEFINIDOS: `documentosObligatorios` es la lista completa (puede estar vacía). PENDIENTES: el cliente no definió los documentos y la acción no se puede completar (S-2).'
    FechaHora:
      type: string
      format: date-time
      description: 'Con la zona de Ecuador (-05:00), por ejemplo 2026-10-09T14:15:00-05:00 (ADR-0006).'

    SolicitudInicioSesion:
      type: object
      required: [identificador, contrasena]
      properties:
        identificador:
          type: string
          description: Correo, nombre de usuario o teléfono.
          minLength: 1
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          x-max-bytes: 72
          description: |
            Como máximo 72 bytes en UTF-8 (límite de BCrypt). `maxLength` cuenta caracteres y solo es una cota
            exterior: una letra con tilde ocupa 2 bytes y un emoji 4. Una contraseña de más de 72 bytes no
            puede estar guardada, así que responde 401 igual que unas credenciales incorrectas; el servidor
            nunca la recorta.
    RespuestaSesion:
      type: object
      required: [tokenAcceso, expiraEn, usuario]
      properties:
        tokenAcceso:
          type: string
        expiraEn:
          type: integer
          description: Segundos de vida del token de acceso (900, es decir, 15 minutos; ADR-0002).
        usuario:
          $ref: '#/components/schemas/Usuario'

    Usuario:
      type: object
      required: [id, nombre, correo, usuario, telefono, roles, paises, activo, version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: |
            Versión de los datos administrativos del usuario (D10, aprobado el 2026-10-13). Empieza en 0 y sube con
            cada cambio que guarda el admin. El inicio de sesión (intentos fallidos y bloqueo) no la cambia. Se
            envía tal cual en `PATCH /usuarios/{usuarioId}` para no sobrescribir cambios de otra persona.
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        usuario:
          type: string
          description: Nombre de usuario para iniciar sesión.
        telefono:
          type: string
        roles:
          type: array
          uniqueItems: true
          description: Uno o varios roles (decisión del equipo). Una lista vacía significa que el usuario no puede acceder.
          items:
            $ref: '#/components/schemas/CodigoRol'
        paises:
          type: array
          items:
            $ref: '#/components/schemas/CodigoPais'
        activo:
          type: boolean
    UsuarioActual:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          required: [permisos]
          properties:
            permisos:
              type: array
              description: Permisos efectivos (la unión de los permisos de todos sus roles), para que el frontend muestre u oculte opciones. El servidor los vuelve a validar en cada llamada.
              items:
                type: string
    Correo:
      type: string
      format: email
      maxLength: 254
      description: 'Único sin distinguir mayúsculas. Máximo 254 caracteres, igual que `usuario.correo` en la base.'
    Telefono:
      type: string
      minLength: 7
      maxLength: 20
      pattern: '^\+?[0-9 ()-]{7,20}$'
      description: |
        Se aceptan espacios, guiones y paréntesis. El servidor los quita antes de guardar, y el resultado debe
        tener de 7 a 15 dígitos con un `+` opcional al inicio (`^\+?[0-9]{7,15}$`, igual que `usuario.telefono`
        en la base). Por ejemplo, `+593 99 000 0001` se guarda como `+593990000001`.
    SolicitudCrearUsuario:
      type: object
      description: 'Los límites son los mismos de la base de datos y de los formularios (`modelo-datos.md` 3.1, "Límites de campos").'
      required: [nombre, correo, usuario, telefono, roles, contrasenaInicial]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        correo:
          $ref: '#/components/schemas/Correo'
        usuario:
          type: string
          minLength: 3
          maxLength: 50
        telefono:
          $ref: '#/components/schemas/Telefono'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: 'Al menos un rol (decisión del equipo, `requerimientos.md` 4.7).'
          items:
            $ref: '#/components/schemas/CodigoRol'
        paises:
          type: array
          items:
            $ref: '#/components/schemas/CodigoPais'
          default: [EC]
        contrasenaInicial:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          x-max-bytes: 72
          description: |
            Al menos 8 caracteres y como máximo **72 bytes en UTF-8**, que es lo que BCrypt procesa. JSON Schema
            no puede limitar bytes: `maxLength: 72` cuenta caracteres y solo es una cota exterior (una letra con
            tilde ocupa 2 bytes; un emoji, 4). El servidor mide los bytes en UTF-8 y, si pasan de 72, responde
            400 `VALIDACION` con el error en este campo. Nunca recorta la contraseña en silencio. La extensión
            `x-max-bytes` deja el límite real escrito para el backend y los formularios.
    SolicitudActualizarUsuario:
      type: object
      description: |
        Los mismos límites que `SolicitudCrearUsuario`. Lleva siempre `version` y al menos un campo que cambie
        (por eso `minProperties: 2`); un cuerpo con solo `version` responde 400 `VALIDACION`.
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: |
            La `Usuario.version` que leyó el cliente (D10). Si ya no es la vigente, 409 `VERSION_DESACTUALIZADA` sin
            cambios. Ausente, negativa, con decimales o de otro tipo (por ejemplo, el texto `"3"`): 400 `VALIDACION`
            con `errores[0].campo = version`.
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        correo:
          $ref: '#/components/schemas/Correo'
        telefono:
          $ref: '#/components/schemas/Telefono'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: 'Reemplaza la lista completa. Al menos un rol; para retirar el acceso se desactiva la cuenta con `activo: false` (decisión del equipo, `requerimientos.md` 4.7).'
          items:
            $ref: '#/components/schemas/CodigoRol'
        paises:
          type: array
          items:
            $ref: '#/components/schemas/CodigoPais'
        activo:
          type: boolean

    Rol:
      type: object
      required: [id, codigo, nombre, permisos]
      properties:
        id:
          type: string
          format: uuid
        codigo:
          $ref: '#/components/schemas/CodigoRol'
        nombre:
          type: string
          maxLength: 100
        permisos:
          type: array
          description: Permisos del rol (por ejemplo, crear pedidos del flujo A o mantener bodegas). Pendiente; la lista exacta se define con los casos de uso de la fase 1.
          items:
            type: string
        etapasQueAtiende:
          type: array
          readOnly: true
          description: |
            Etapas de las que el rol es responsable (requisito 4.6). Es de solo lectura: se deriva del
            `rolResponsable` de las definiciones de flujo, que son la única fuente, para no duplicarlo
            (ADR-0004, aceptado por el equipo el 2026-10-15).
          items:
            type: object
            required: [tipoFlujo, numero]
            properties:
              tipoFlujo:
                $ref: '#/components/schemas/TipoFlujo'
              numero:
                type: integer
    SolicitudRol:
      type: object
      required: [codigo, nombre, permisos]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoRol'
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        permisos:
          type: array
          description: Pendiente. La lista de permisos se define con los casos de uso de la fase 1.
          items:
            type: string
            minLength: 1
            maxLength: 100

    DefinicionFlujo:
      type: object
      required: [pais, tipoFlujo, version, etapas]
      properties:
        pais:
          $ref: '#/components/schemas/CodigoPais'
        tipoFlujo:
          $ref: '#/components/schemas/TipoFlujo'
        version:
          type: integer
          minimum: 1
        etapas:
          type: array
          items:
            $ref: '#/components/schemas/DefinicionEtapa'
    DefinicionEtapa:
      type: object
      required: [numero, nombre, rolResponsable, estadoPlazo, acciones, automatica, registraLlegada]
      properties:
        numero:
          type: integer
          minimum: 1
        nombre:
          type: string
        estadoPlazo:
          $ref: '#/components/schemas/EstadoPlazo'
        revisaEtapa:
          type: [integer, 'null']
          description: Etapa cuyos archivos revisa esta etapa (P-17). En la fase 2 solo A3 revisa A2; no se deduce de la etapa siguiente. Si A4 necesita los documentos de A2 sigue pendiente.
        rolResponsable:
          oneOf:
            - $ref: '#/components/schemas/CodigoRol'
            - type: 'null'
          description: 'Rol responsable de la etapa. Nulo solo en etapas automáticas (`automatica: true`), como Fin, que no tienen responsable (decisión S-1 del equipo, 2026-10-15).'
        plazo:
          oneOf:
            - $ref: '#/components/schemas/Plazo'
            - type: 'null'
          description: 'Solo con `estadoPlazo` DEFINIDO; nulo con SIN_PLAZO o PENDIENTE.'
        acciones:
          type: array
          description: 'Acciones permitidas en la etapa, con su destino y sus requisitos (tabla de `ejecutarAccionEtapa`; `arquitectura.md`, 4.2).'
          items:
            $ref: '#/components/schemas/DefinicionAccion'
        automatica:
          type: boolean
          description: 'Verdadero solo en Fin (A11 / B12), que se marca sola.'
        registraLlegada:
          type: boolean
          x-decision: 'ADR-0018, decisión del equipo (2026-10-19): marca explícita de la definición versionada del flujo; no se deduce de REPORTAR_DEMORA.'
          description: 'Etapa de llegada a aduana: al aprobarla, el pedido guarda `llegadaAduanaEn` con la hora del servidor. Como máximo una por versión de flujo y nunca automática. En el flujo A vigente, solo A7. Agregado en 0.9.1.'
    DefinicionAccion:
      type: object
      required: [accion, etapaDestino, requiereObservacion, requiereUrgencia, requiereBodega, requisitosDocumentales, documentosObligatorios, exigeAlgunDocumento]
      properties:
        accion:
          $ref: '#/components/schemas/AccionEtapa'
        etapaDestino:
          type: [integer, 'null']
          description: 'Número de la etapa de destino. Nulo si el pedido se queda en la misma etapa (REPORTAR_DEMORA, ELEGIR_BODEGA).'
        requiereObservacion:
          type: boolean
        requiereUrgencia:
          type: boolean
        requiereBodega:
          type: boolean
        requisitosDocumentales:
          $ref: '#/components/schemas/RequisitosDocumentales'
        documentosObligatorios:
          type: array
          description: 'Tipos de documento que deben estar adjuntos a la etapa antes de la acción (por ejemplo, "Packing List" en A6). Se pueden adjuntar otros tipos además.'
          items:
            type: string
        exigeAlgunDocumento:
          type: boolean
          description: 'Hace falta al menos un documento adjunto de la entrada actual, de cualquier tipo (A9 y A10 desde V16). No fija un tipo comercial. Agregado en 0.14.0.'
    Plazo:
      type: object
      required: [cantidad, tipo]
      properties:
        cantidad:
          type: integer
          minimum: 1
        tipo:
          $ref: '#/components/schemas/TipoPlazo'

    SolicitudCrearPedido:
      type: object
      required: [tipoFlujo, nombre]
      properties:
        tipoFlujo:
          $ref: '#/components/schemas/TipoFlujo'
        pais:
          allOf:
            - $ref: '#/components/schemas/CodigoPais'
          default: EC
          description: |
            Desde 0.17.0 (ADR-0024): EC o CO, si el país está asignado hoy a quien crea (también al admin); si no, 403.
            Antes de reservar el número. La numeración es por país y año.
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        descripcion:
          type: string
          maxLength: 4000
        incluyeProductosNuevos:
          type: boolean
          description: 'Solo flujo A: el pedido de Ecuador incluye productos nuevos además de existentes (requisito 4.2 #6).'
          default: false

    PedidoResumen:
      type: object
      required: [id, numero, nombre, pais, tipoFlujo, etapaActual, nombreEtapaActual, vencida, finalizado]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: 'Número único que no se reutiliza (requisito 4.2 #5). Formato propuesto y pendiente de aprobación DK-EC-AAAA-NNNN.'
          examples: [DK-EC-2026-0001]
        nombre:
          type: string
        pais:
          $ref: '#/components/schemas/CodigoPais'
        tipoFlujo:
          $ref: '#/components/schemas/TipoFlujo'
        etapaActual:
          type: integer
          minimum: 1
        nombreEtapaActual:
          type: string
        responsableActual:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        venceEn:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        vencida:
          type: boolean
        motivoRetraso:
          type: [string, 'null']
          description: 'Motivo vigente del retraso de la entrada actual (F5-D3, 0.12.0). Nulo si no hay; una reentrada lo limpia. Los anteriores están en el historial (MOTIVO_RETRASO_REGISTRADO).'
        urgencia:
          oneOf:
            - $ref: '#/components/schemas/Urgencia'
            - type: 'null'
        finalizado:
          type: boolean
    PedidoDetalle:
      allOf:
        - $ref: '#/components/schemas/PedidoResumen'
        - type: object
          required: [creadoPor, creadoEn, versionFlujo, lineaDeTiempo, accionesDisponibles]
          properties:
            descripcion:
              type: [string, 'null']
            incluyeProductosNuevos:
              type: boolean
            creadoPor:
              $ref: '#/components/schemas/UsuarioResumen'
            creadoEn:
              $ref: '#/components/schemas/FechaHora'
            versionFlujo:
              type: integer
            bodega:
              description: 'Bodega de destino (F4-D2): nula hasta aprobar Bodega; después no cambia y se muestra aunque se haya desactivado.'
              oneOf:
                - $ref: '#/components/schemas/Bodega'
                - type: 'null'
            demoraAduana:
              oneOf:
                - $ref: '#/components/schemas/DemoraAduana'
                - type: 'null'
            llegadaAduanaEn:
              description: 'Check de llegada de A7 (APROBAR), con la hora del servidor. Nulo si todavía no llegó. Agregado en 0.9.0.'
              oneOf:
                - $ref: '#/components/schemas/FechaHora'
                - type: 'null'
            lineaDeTiempo:
              type: array
              description: 'Una entrada por etapa del flujo, en orden; la etapa actual tiene estado ACTUAL.'
              items:
                $ref: '#/components/schemas/EtapaEnLinea'
            accionesDisponibles:
              type: array
              description: |
                Acciones de la etapa actual que la persona puede pedir ahora según P-06, en una etapa habilitada en
                esta fase; vacío si no le corresponde. Cada una dice qué exige y si se puede completar ya.
                **Cambio de tipo en 0.7.0** (antes era una lista de `AccionEtapa`).
              items:
                $ref: '#/components/schemas/AccionDisponible'
    ConversacionAsistente:
      type: object
      x-origen: decision-equipo
      required: [id, pedidoId, numeroPedido, creadaEn, expiraEn, preguntasRestantes]
      properties:
        id:
          type: string
          format: uuid
        pedidoId:
          type: string
          format: uuid
        numeroPedido:
          type: string
        creadaEn:
          $ref: '#/components/schemas/FechaHora'
        expiraEn:
          description: Fin de la conservación del piloto (30 días, F7-D5). Después se elimina del almacenamiento activo.
          allOf:
            - $ref: '#/components/schemas/FechaHora'
        preguntasRestantes:
          type: integer
          minimum: 0
          maximum: 10
    ConversacionAsistenteDetalle:
      allOf:
        - $ref: '#/components/schemas/ConversacionAsistente'
        - type: object
          required: [mensajes]
          properties:
            mensajes:
              type: array
              items:
                $ref: '#/components/schemas/MensajeAsistente'
    MensajeAsistente:
      type: object
      required: [orden, autor, creadoEn, retenido]
      properties:
        orden:
          type: integer
          minimum: 1
        autor:
          type: string
          enum: [USUARIO, ASISTENTE]
        creadoEn:
          $ref: '#/components/schemas/FechaHora'
        retenido:
          type: boolean
          description: |
            true si el usuario ya no puede consultar alguna fuente del mensaje (permiso de descarga perdido). Entonces no
            se incluyen `texto`, `referencias` ni `documentosExcluidos`.
        texto:
          type: string
        evidenciaSuficiente:
          type: boolean
        referencias:
          type: array
          items:
            $ref: '#/components/schemas/ReferenciaAsistente'
        documentosExcluidos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoExcluidoAsistente'
    PreguntaAsistente:
      type: object
      required: [pregunta]
      additionalProperties: false
      properties:
        pregunta:
          type: string
          minLength: 1
          maxLength: 2000
    RespuestaAsistente:
      type: object
      required: [texto, evidenciaSuficiente, referencias, documentosExcluidos, preguntasRestantes]
      properties:
        texto:
          type: string
          description: Respuesta del asistente. Si no hay evidencia suficiente, lo dice en lugar de suponer.
        evidenciaSuficiente:
          type: boolean
          description: false si no queda ninguna referencia válida después de verificarlas en el servidor.
        referencias:
          type: array
          description: Solo referencias verificadas (documento autorizado enviado en esta consulta y página existente).
          items:
            $ref: '#/components/schemas/ReferenciaAsistente'
        documentosExcluidos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoExcluidoAsistente'
        preguntasRestantes:
          type: integer
          minimum: 0
    ReferenciaAsistente:
      type: object
      required: [numeroPedido]
      properties:
        numeroPedido:
          type: string
        etapa:
          type: [integer, 'null']
          description: Número de etapa del dato o del documento citado, si aplica.
        archivoId:
          type: [string, 'null']
          format: uuid
        nombreArchivo:
          type: [string, 'null']
        pagina:
          type: [integer, 'null']
          minimum: 1
          description: Página del PDF (desde 1), validada contra el número de páginas. Nula si la fuente no tiene páginas.
        textoCitado:
          type: [string, 'null']
    DocumentoExcluidoAsistente:
      type: object
      required: [archivoId, nombreArchivo, motivo]
      properties:
        archivoId:
          type: string
          format: uuid
        nombreArchivo:
          type: string
        motivo:
          type: string
          enum: [FORMATO_NO_ADMITIDO, CONTEXTO_EXCEDIDO, NO_AUTORIZADO_PILOTO]
          description: |
            FORMATO_NO_ADMITIDO: no es PDF por su contenido. CONTEXTO_EXCEDIDO: no cabe en 60 000 tokens.
            NO_AUTORIZADO_PILOTO: no está en el manifiesto revisado del piloto (F7-D3).
    PaginaConversacionesAsistente:
      type: object
      required: [elementos, pagina, tamano, total]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/ConversacionAsistente'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    PreciosAsistente:
      type: object
      required: [entradaMicroUsdMtok, salidaMicroUsdMtok, escrituraCacheMicroUsdMtok, lecturaCacheMicroUsdMtok]
      description: Micro-USD por millón de tokens (US$0.10/MTok = 100000).
      properties:
        entradaMicroUsdMtok:
          type: integer
          minimum: 1
        salidaMicroUsdMtok:
          type: integer
          minimum: 1
        escrituraCacheMicroUsdMtok:
          type: integer
          minimum: 1
        lecturaCacheMicroUsdMtok:
          type: integer
          minimum: 1
    NuevaTarifaAsistente:
      type: object
      required: [modelo, vigenteDesde, base, fuente, consultadoEn]
      properties:
        modelo:
          type: string
          maxLength: 100
        vigenteDesde:
          type: string
          format: date
        base:
          $ref: '#/components/schemas/PreciosAsistente'
        umbralTokensEntrada:
          type: [integer, 'null']
          minimum: 1
          description: Por encima, toda la petición paga los precios `superior`. Va junto con `superior`.
        superior:
          oneOf:
            - $ref: '#/components/schemas/PreciosAsistente'
            - type: 'null'
        fuente:
          type: string
          maxLength: 500
          description: URL https de la documentación oficial de Anthropic.
        consultadoEn:
          type: string
          format: date
    TarifaAsistente:
      allOf:
        - $ref: '#/components/schemas/NuevaTarifaAsistente'
        - type: object
          required: [id, validada]
          properties:
            id:
              type: string
              format: uuid
            validada:
              type: boolean
            registradaPor:
              type: [string, 'null']
              format: uuid
              description: Nulo si la sembró una migración.
            registradaEn:
              $ref: '#/components/schemas/FechaHora'
            validadaPor:
              type: [string, 'null']
              format: uuid
            validadaEn:
              type: [string, 'null']
    ConfiguracionAsistente:
      type: object
      x-roles: [admin]
      required: [habilitada, entornoHabilitado, pilotoFicticio, modelo, disponible, version, limites]
      properties:
        habilitada:
          type: boolean
          description: Interruptor de la base (el apagado automático lo pone en false).
        motivoDeshabilitada:
          type: [string, 'null']
        entornoHabilitado:
          type: boolean
          description: IA_HABILITADA=true con clave y modelo configurados. No se muestra la clave.
        pilotoFicticio:
          type: boolean
        modelo:
          type: string
        disponible:
          type: boolean
          description: true solo si todos los controles están presentes y preguntar puede llamar al proveedor.
        version:
          type: integer
        limites:
          type: object
          required: [tokensEntradaMax, tokensSalidaMax, preguntasPorConversacion, consultasUsuarioDia, enCursoUsuario,
                     consultasDia, presupuestoMesUsd, esperaReservaSegundos]
          properties:
            tokensEntradaMax:
              type: integer
            tokensSalidaMax:
              type: integer
            preguntasPorConversacion:
              type: integer
            consultasUsuarioDia:
              type: integer
            enCursoUsuario:
              type: integer
            consultasDia:
              type: integer
            presupuestoMesUsd:
              type: string
            esperaReservaSegundos:
              type: integer
              description: Propuesta del equipo (no es un límite de F7-D2); reservas abiertas más tiempo se dan por consumidas.
        tarifa:
          oneOf:
            - $ref: '#/components/schemas/TarifaAsistente'
            - type: 'null'
    ConsumoAsistente:
      type: object
      x-roles: [admin]
      required: [presupuestoMesUsd, consumidoMesUsd, reservadoMesUsd, dias]
      properties:
        reservadoMesUsd:
          type: string
          description: Reservas abiertas del mes (paso 7.5).
        presupuestoMesUsd:
          type: string
          description: Decimal en texto (por ejemplo "10.00"), para no perder precisión.
        consumidoMesUsd:
          type: string
        dias:
          type: array
          items:
            type: object
            required: [fecha, usuarioId, consultas, tokensEntrada, tokensSalida, costoUsd]
            properties:
              fecha:
                type: string
                format: date
              usuarioId:
                type: string
                format: uuid
              consultas:
                type: integer
              tokensEntrada:
                type: integer
              tokensSalida:
                type: integer
              costoUsd:
                type: string
    PaginaPedidos:
      type: object
      required: [elementos, pagina, tamano, total]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/PedidoResumen'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    PaginaEventos:
      type: object
      required: [elementos, pagina, tamano, total]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/EventoHistorial'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    PaginaNotificaciones:
      type: object
      required: [elementos, pagina, tamano, total]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    UsuarioResumen:
      type: object
      required: [id, nombre, roles]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CodigoRol'
    AccionDisponible:
      type: object
      required: [accion, etapaDestino, requiereObservacion, requiereUrgencia, requiereBodega, requisitosDocumentales, documentosObligatorios, documentosFaltantes, puedeCompletarse, exigeAlgunDocumento]
      properties:
        accion:
          $ref: '#/components/schemas/AccionEtapa'
        etapaDestino:
          type: [integer, 'null']
        requiereObservacion:
          type: boolean
        requiereUrgencia:
          type: boolean
        requiereBodega:
          type: boolean
          description: 'La acción se envía con `bodegaId` (APROBAR de Bodega, F4-D2). Agregado en 0.10.0.'
        requisitosDocumentales:
          $ref: '#/components/schemas/RequisitosDocumentales'
        documentosObligatorios:
          type: array
          items:
            type: string
        documentosFaltantes:
          type: array
          description: 'Tipos obligatorios sin ningún archivo subido a la entrada actual de la etapa (P-18). Con `exigeAlgunDocumento` y ningún archivo subido, incluye "al menos un documento".'
          items:
            type: string
        puedeCompletarse:
          type: boolean
          description: Falso si los documentos están PENDIENTES de definir, si falta algún documento o si la acción todavía no está implementada. La observación, la urgencia, la fecha de una demora y la bodega se envían con la acción y no cuentan aquí.
        exigeAlgunDocumento:
          type: boolean
          description: 'Hace falta al menos un documento de la entrada actual, de cualquier tipo (A9 y A10 desde V16). Agregado en 0.14.0.'
    EtapaEnLinea:
      type: object
      required: [numero, nombre, estado, rolResponsable, estadoPlazo]
      properties:
        numero:
          type: integer
        nombre:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoEtapa'
        rolResponsable:
          oneOf:
            - $ref: '#/components/schemas/CodigoRol'
            - type: 'null'
          description: 'Nulo solo en etapas automáticas, como Fin (S-1, 2026-10-15).'
        estadoPlazo:
          $ref: '#/components/schemas/EstadoPlazo'
        asignadoA:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        asignacionVigente:
          type: [boolean, 'null']
          description: 'null sin persona asignada (actúan quienes tengan el rol, o el admin; P-06). true si la persona asignada está activa y tiene el rol. false si ya no puede actuar: solo el admin actúa o reasigna.'
        entradaId:
          type: [string, 'null']
          format: uuid
          description: Identificador de la entrada actual (o la última) a la etapa; cambia en cada entrada o reentrada. Nulo si el pedido nunca entró (P-18).
        entrada:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        salida:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        venceEn:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        reentradas:
          type: integer
          minimum: 0
        resumen:
          type: [string, 'null']
          description: |
            Resumen de lo ocurrido en la etapa (requisito 4.2 #17). **P-20, regla provisional del equipo
            (2026-10-16), pendiente del cliente:** describe la última entrada cerrada de la etapa con el evento del
            historial que la cerró (enviar, aprobar, rechazar o devolver): acción, persona (nombre vigente o, si no se
            resuelve, su identificador), rol con el que intervino, fecha y hora de Ecuador, etapa de destino,
            observación recortada a 200 caracteres con "…" (completa en el historial) y archivos presentados. Si la
            etapa está activa otra vez, el texto empieza con "Entrada anterior". Nulo si la etapa nunca tuvo una
            entrada cerrada o no hay un evento que lo reconstruya; no se atribuye a una etapa el evento de otra.
    Urgencia:
      type: object
      required: [nivel, horas, activadaEn, venceEn]
      properties:
        vencida:
          type: boolean
          description: 'Paso 5.3 (0.13.0): la urgencia vigente ya venció. Lo decide el servidor con su reloj.'
        nivel:
          $ref: '#/components/schemas/NivelUrgencia'
        horas:
          type: integer
          enum: [4, 12, 24]
        activadaEn:
          $ref: '#/components/schemas/FechaHora'
        venceEn:
          $ref: '#/components/schemas/FechaHora'
          description: 'Vencimiento propio de la urgencia, desde la devolución hasta volver a A4 / B5.'
    DemoraAduana:
      type: object
      description: |
        Demora vigente en aduana (la última; las anteriores están en el historial). F4-D5, provisional. La fecha es una
        estimación de llegada, no un vencimiento: no cambia `venceEn` ni `vencida`. Es el dato que usará el cronograma
        de la fase 5 para recalcular las etapas siguientes (todavía no implementado).
      required: [reportadaPor, reportadaEn, motivo, nuevaFechaEstimadaLlegada]
      properties:
        reportadaPor:
          $ref: '#/components/schemas/UsuarioResumen'
        reportadaEn:
          $ref: '#/components/schemas/FechaHora'
        motivo:
          type: string
        nuevaFechaEstimadaLlegada:
          type: string
          format: date

    SolicitudAccion:
      oneOf:
        - $ref: '#/components/schemas/AccionEnviar'
        - $ref: '#/components/schemas/AccionAprobar'
        - $ref: '#/components/schemas/AccionRechazar'
        - $ref: '#/components/schemas/AccionDevolverPorError'
        - $ref: '#/components/schemas/AccionDevolverPorProductoNuevo'
        - $ref: '#/components/schemas/AccionReportarDemora'
        - $ref: '#/components/schemas/AccionElegirBodega'
      discriminator:
        propertyName: accion
        mapping:
          ENVIAR: '#/components/schemas/AccionEnviar'
          APROBAR: '#/components/schemas/AccionAprobar'
          RECHAZAR: '#/components/schemas/AccionRechazar'
          DEVOLVER_POR_ERROR: '#/components/schemas/AccionDevolverPorError'
          DEVOLVER_POR_PRODUCTO_NUEVO: '#/components/schemas/AccionDevolverPorProductoNuevo'
          REPORTAR_DEMORA: '#/components/schemas/AccionReportarDemora'
          ELEGIR_BODEGA: '#/components/schemas/AccionElegirBodega'
    AccionBase:
      type: object
      required: [accion, etapaEsperada]
      properties:
        accion:
          $ref: '#/components/schemas/AccionEtapa'
        etapaEsperada:
          type: integer
          minimum: 1
          x-origen: propuesta
          description: 'Propuesta de diseño: etapa que el usuario ve en pantalla. Si no coincide con la actual, la respuesta es 409 ETAPA_CAMBIO.'
        adjuntoIds:
          type: array
          description: 'Archivos subidos a la entrada actual de la etapa actual que acompañan la acción. Un id inválido responde 400; nunca se ignora (P-05, P-18).'
          items:
            type: string
            format: uuid
    AccionEnviar:
      allOf:
        - $ref: '#/components/schemas/AccionBase'
        - type: object
          properties:
            accion:
              const: ENVIAR
            observacion:
              type: string
              maxLength: 4000
    AccionAprobar:
      allOf:
        - $ref: '#/components/schemas/AccionBase'
        - type: object
          properties:
            accion:
              const: APROBAR
            observacion:
              type: string
              maxLength: 4000
              description: 'Obligatoria en Fabricación (A5 / B6), según el requisito 4.4.'
            bodegaId:
              type: string
              format: uuid
              x-decision: 'F4-D2, provisional del equipo (2026-10-19): obligatoria al aprobar Bodega (A9 / B10) y prohibida en las demás etapas. Agregado en 0.10.0.'
              description: 'Bodega activa de destino. Solo al aprobar Bodega; se asigna una sola vez.'
    AccionRechazar:
      allOf:
        - $ref: '#/components/schemas/AccionBase'
        - type: object
          required: [observacion]
          properties:
            accion:
              const: RECHAZAR
            observacion:
              type: string
              minLength: 1
              maxLength: 4000
    AccionDevolverPorError:
      allOf:
        - $ref: '#/components/schemas/AccionBase'
        - type: object
          required: [observacion]
          properties:
            accion:
              const: DEVOLVER_POR_ERROR
            observacion:
              type: string
              minLength: 1
              maxLength: 4000
    AccionDevolverPorProductoNuevo:
      allOf:
        - $ref: '#/components/schemas/AccionBase'
        - type: object
          required: [observacion, nivelUrgencia]
          properties:
            accion:
              const: DEVOLVER_POR_PRODUCTO_NUEVO
            observacion:
              type: string
              minLength: 1
              maxLength: 4000
            nivelUrgencia:
              $ref: '#/components/schemas/NivelUrgencia'
    AccionReportarDemora:
      allOf:
        - $ref: '#/components/schemas/AccionBase'
        - type: object
          required: [observacion, nuevaFechaEstimadaLlegada]
          properties:
            accion:
              const: REPORTAR_DEMORA
            observacion:
              type: string
              minLength: 1
              maxLength: 4000
            nuevaFechaEstimadaLlegada:
              type: string
              format: date
              x-decision: 'F4-D5, provisional del equipo (2026-10-19), pendiente de confirmación del cliente: la escribe quien actúa en A7. Si cae en fin de semana se guarda el lunes; la fecha efectiva no es anterior a hoy en Ecuador y es posterior a la estimación vigente.'
              description: 'Fecha estimada de llegada en formato estricto `AAAA-MM-DD`, sin hora ni zona. Otro formato (fecha con hora, número, arreglo, texto) responde 400. Si el cliente decide que la calcule el sistema, el campo pasa a opcional.'
              x-pendiente: Recálculo en aduana (¿la escribe David o la calcula el sistema?).
    AccionElegirBodega:
      description: 'No se usa (F4-D2): la bodega se elige con el APROBAR de Bodega. No está en los datos del flujo; responde 409 TRANSICION_NO_PERMITIDA.'
      deprecated: true
      allOf:
        - $ref: '#/components/schemas/AccionBase'
        - type: object
          required: [bodegaId]
          properties:
            accion:
              const: ELEGIR_BODEGA
            bodegaId:
              type: string
              format: uuid

    EventoHistorial:
      type: object
      description: 'Evento inmutable del pedido (requisito 4.2, invariantes; ADR-0012 propuesta).'
      required: [id, pedidoId, etapa, tipo, usuario, fecha]
      properties:
        id:
          type: string
          format: uuid
        pedidoId:
          type: string
          format: uuid
        numeroPedido:
          type: string
        etapa:
          type: integer
        tipo:
          type: string
          enum: [PEDIDO_CREADO, ETAPA_ENVIADA, ETAPA_APROBADA, ETAPA_RECHAZADA, PEDIDO_DEVUELTO, DEMORA_REPORTADA, BODEGA_ASIGNADA, OBSERVACION_AGREGADA, ARCHIVO_SUBIDO, ETAPA_REASIGNADA, PLAZO_VENCIDO, MOTIVO_RETRASO_REGISTRADO, PEDIDO_FINALIZADO]
        usuario:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
          description: 'Nulo en los eventos del sistema (Fin automático, plazo vencido).'
        rolIntervencion:
          oneOf:
            - $ref: '#/components/schemas/CodigoRol'
            - type: 'null'
          description: 'Rol con el que intervino la persona (el responsable de la etapa o admin), tal como era al actuar. Nulo en los eventos del sistema.'
        detalle:
          $ref: '#/components/schemas/DetalleEvento'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        observacion:
          type: [string, 'null']
        nivelUrgencia:
          oneOf:
            - $ref: '#/components/schemas/NivelUrgencia'
            - type: 'null'
        adjuntoIds:
          type: array
          items:
            type: string
            format: uuid

    DetalleEvento:
      type: object
      description: Detalle según el tipo de evento; cada campo es nulo cuando no aplica.
      properties:
        etapaDestino:
          type: [integer, 'null']
        motivoDevolucion:
          type: [string, 'null']
          enum: [ERROR, PRODUCTO_NUEVO, null]
        urgenciaTerminada:
          type: [boolean, 'null']
        asignadoAnterior:
          type: [string, 'null']
          format: uuid
        asignadoA:
          type: [string, 'null']
          format: uuid
        fechaEstimadaAnterior:
          type: [string, 'null']
          format: date
          description: 'DEMORA_REPORTADA: estimación vigente antes de la demora; nula si es la primera. Agregado en 0.9.0.'
        fechaEstimadaSolicitada:
          type: [string, 'null']
          format: date
          description: 'DEMORA_REPORTADA: la fecha que escribió la persona, solo si es distinta de la guardada (caía en fin de semana).'
        nuevaFechaEstimadaLlegada:
          type: [string, 'null']
          format: date
          description: 'DEMORA_REPORTADA: la fecha guardada (ya en día hábil).'
        bodegaId:
          type: [string, 'null']
          format: uuid
          description: 'BODEGA_ASIGNADA: la bodega elegida al aprobar Bodega. Agregado en 0.10.0.'
        claseVencimiento:
          type: [string, 'null']
          enum: [ETAPA, URGENCIA, null]
          description: 'PLAZO_VENCIDO (0.12.0): plazo de la entrada de la etapa o de la urgencia. Si vencen los dos, hay dos eventos.'
        venceEn:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
          description: 'PLAZO_VENCIDO (0.12.0): el vencimiento que se incumplió. La hora del evento es la de la detección.'
    Adjunto:
      type: object
      required: [id, pedidoId, etapa, entradaId, nombre, tipoDocumento, tamanoBytes, subidoPor, subidoEn, estadoCopia]
      properties:
        id:
          type: string
          format: uuid
        pedidoId:
          type: string
          format: uuid
        etapa:
          type: integer
        entradaId:
          type: string
          format: uuid
          description: Entrada de la etapa a la que se subió (P-18). Solo los archivos de la entrada actual cumplen requisitos.
        eventoId:
          type: [string, 'null']
          format: uuid
          description: Evento ARCHIVO_SUBIDO del historial.
        nombre:
          type: string
          description: Nombre original, solo para mostrar; el servidor no lo usa para guardar ni para decidir el tipo.
        tipoDocumento:
          type: string
        tamanoBytes:
          type: integer
          minimum: 1
          description: Medido por el servidor. Límite provisional del equipo de 100 MiB, configurable (contradicción 7).
        subidoPor:
          $ref: '#/components/schemas/UsuarioResumen'
        subidoEn:
          $ref: '#/components/schemas/FechaHora'
        estadoCopia:
          $ref: '#/components/schemas/EstadoCopia'

    Bodega:
      type: object
      required: [id, nombre, ciudad, activa, version, pais]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          description: Único dentro de cada país (V19).
        ciudad:
          type: [string, 'null']
          description: |
            Nula mientras la ciudad está pendiente (0.17.0): "Bodega 1" de Colombia, decisión de Richard del 2026-10-22.
            Una bodega creada con `POST /bodegas` siempre tiene ciudad.
          x-pendiente: 'Ciudad de "Bodega 1" de Colombia.'
        pais:
          $ref: '#/components/schemas/CodigoPais'
        activa:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          description: Versión de la bodega; se envía tal cual en el PATCH para no sobrescribir cambios de otra persona.
    SolicitudBodega:
      type: object
      required: [nombre, ciudad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        ciudad:
          type: string
          minLength: 1
          maxLength: 100
        activa:
          type: boolean
          default: true
        pais:
          allOf:
            - $ref: '#/components/schemas/CodigoPais'
          default: EC
          description: País de la bodega (0.17.0). Exige Logística o admin con ese país asignado; si no, 403.
    SolicitudActualizarBodega:
      type: object
      required: [version]
      minProperties: 2
      description: Solo se envían los campos que cambian (por ejemplo, `activa` para desactivarla), más `version`.
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: La versión de la bodega que leyó el cliente.
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        ciudad:
          type: string
          minLength: 1
          maxLength: 100
        activa:
          type: boolean

    Cronograma:
      type: object
      description: 'F5-D1 opción A (0.11.0). Fechas en días de Ecuador. Ver GET /pedidos/{pedidoId}/cronograma.'
      required: [pedidoId, fechaPedido, meta, llegada, totalDias, diferenciaContraMeta, calculable, faltantes, etapas]
      properties:
        pedidoId:
          type: string
          format: uuid
        fechaPedido:
          type: string
          format: date
        meta:
          type: object
          required: [dias, origen, pendienteDelCliente]
          properties:
            dias:
              type: integer
              minimum: 1
            origen:
              type: string
              enum: [PROPUESTA, ADMIN]
              description: 'PROPUESTA: los 90 días sembrados, propuesta documentada sin aprobación. ADMIN: configurada por el admin.'
            pendienteDelCliente:
              type: boolean
              description: 'Siempre true mientras el cliente no fije la meta ("se ajusta"). La meta propuesta de 90 días (o la que configure el admin) no es un objetivo aprobado ni permite declarar cumplimiento del cliente.'
        llegada:
          description: 'Fecha de llegada comparada con la meta; nula si no se puede estimar.'
          oneOf:
            - type: object
              required: [fecha, procedencia]
              properties:
                fecha:
                  type: string
                  format: date
                procedencia:
                  $ref: '#/components/schemas/ProcedenciaFecha'
            - type: 'null'
        totalDias:
          type: [integer, 'null']
          description: 'Días corridos de fechaPedido a la llegada (métrica del PRD). Nulo si no es calculable.'
        diferenciaContraMeta:
          type: [integer, 'null']
          description: 'totalDias menos meta.dias; positivo si supera la meta. Nulo si no es calculable. Un valor igual o menor que cero no significa que se cumpla un objetivo del cliente: la meta sigue pendiente.'
        calculable:
          type: boolean
          description: 'false si falta alguna duración necesaria para la llegada; entonces total y diferencia son nulos.'
        faltantes:
          type: array
          description: 'Etapas con plazo pendiente del cliente que dejaron fechas sin estimar.'
          items:
            type: object
            required: [numero, nombre]
            properties:
              numero:
                type: integer
              nombre:
                type: string
        etapas:
          type: array
          items:
            type: object
            required: [numero, nombre, fechaPlanificada, movidaAlLunes, fechaEstimada, fechaReal, estado, procedencia, plazoPendiente]
            properties:
              numero:
                type: integer
              nombre:
                type: string
              fechaPlanificada:
                type: [string, 'null']
                format: date
                description: 'Inicio + plazo definido. Nula si el plazo está pendiente o si no se conoce el inicio.'
              movidaAlLunes:
                type: boolean
              fechaEstimada:
                type: [string, 'null']
                format: date
                description: 'Solo en la etapa de llegada con demora reportada y sin llegada real (F4-D5).'
              fechaReal:
                type: [string, 'null']
                format: date
              estado:
                type: string
                enum: [REAL, ESTIMADA, EN_CURSO, PLANIFICADA, SIN_ESTIMAR]
              procedencia:
                description: 'De dónde sale el fin de la etapa con el que empieza la siguiente; nula si no se conoce.'
                oneOf:
                  - $ref: '#/components/schemas/ProcedenciaFecha'
                  - type: 'null'
              plazoPendiente:
                type: boolean
    ProcedenciaFecha:
      type: string
      enum: [REAL, LLEGADA_REAL, LLEGADA_ESTIMADA, PLANIFICADA]
      description: 'REAL: salida registrada. LLEGADA_REAL: check de llegada (ADR-0018). LLEGADA_ESTIMADA: estimación por demora (F4-D5). PLANIFICADA: inicio + plazo.'
    ConfiguracionPlazos:
      type: object
      required: [metaDias, origenMeta, metaPendienteDelCliente, feriados, actualizadoEn, version]
      properties:
        metaDias:
          type: integer
          minimum: 1
        origenMeta:
          type: string
          enum: [PROPUESTA, ADMIN]
          description: 'PROPUESTA: 90 días sembrados en V14, propuesta documentada sin aprobación provisional. ADMIN: la cambió el admin.'
        metaPendienteDelCliente:
          type: boolean
          description: 'true mientras el cliente no fije la meta ("se ajusta"). Mientras sea true, la meta no es un objetivo aprobado ni sirve para declarar cumplimiento del cliente.'
        feriados:
          type: array
          description: 'Siempre vacía: feriados de Ecuador y China pendientes del cliente (Could en el PRD).'
          x-pendiente: Feriados de Ecuador y China.
          maxItems: 0
          items:
            type: object
        actualizadoEn:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        version:
          type: integer
          minimum: 0
    SolicitudConfiguracionPlazos:
      type: object
      required: [metaDias, version]
      properties:
        metaDias:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 0
          description: 'La versión que leyó el cliente; 409 VERSION_DESACTUALIZADA si cambió.'
        feriados:
          type: array
          maxItems: 0
          description: 'Pendientes del cliente: una lista no vacía se rechaza con 400.'
          items:
            type: object

    SolicitudMotivoRetraso:
      type: object
      required: [entradaEsperadaId, motivo]
      properties:
        entradaEsperadaId:
          type: string
          format: uuid
          description: 'Entrada actual de la etapa que ve la persona (P-18).'
        motivo:
          type: string
          minLength: 1
          maxLength: 4000

    Notificacion:
      type: object
      required: [id, pedidoId, eventoId, destinatario, asunto, estado, creadaEn, enviadaEn, intentos, ultimoError, resultadoIncierto, bloqueo]
      description: Una fila del outbox, sin cuerpos, tokens ni datos privados de Google. Destinatario nulo conserva la intención no entregable. ENVIADA significa aceptación del proveedor, no recepción final. Message-ID no garantiza exactamente una vez.
      properties:
        eventoId:
          type: string
          format: uuid
        resultadoIncierto:
          type: boolean
        bloqueo:
          type: [string, 'null']
          enum: [DESTINATARIO_PENDIENTE, null]
        id:
          type: string
          format: uuid
        pedidoId:
          type: [string, 'null']
          format: uuid
        destinatario:
          type: [string, 'null']
          format: email
        asunto:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoNotificacion'
        creadaEn:
          $ref: '#/components/schemas/FechaHora'
        enviadaEn:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        intentos:
          type: integer
          minimum: 0
        ultimoError:
          type: [string, 'null']
