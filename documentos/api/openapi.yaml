  /pedidos/{pedidoId}/historial:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    get:
      tags: [historial]
      operationId: consultarHistorialPedido
      summary: Historial completo del pedido (solo inserción)
      x-origen: requisito
      description: |
        Mismo permiso que leer el pedido (P-13, provisional del equipo): persona activa con al menos un rol vigente;
        si no, 403. Cada evento conserva el actor y el rol con el que intervino en ese momento.

        **Orden (F4-H01, 0.10.1):** del más reciente al más antiguo por la hora del servidor. Cuando varios eventos
        tienen la misma hora (los de una misma acción, por ejemplo `BODEGA_ASIGNADA` y `ETAPA_APROBADA` al aprobar
        Bodega, o `ETAPA_APROBADA` y `PEDIDO_FINALIZADO` al aprobar Incidencias), se desempatan por la secuencia de
        inserción, que sigue el orden en que el dominio los emite: aparece primero el último evento emitido. La
        secuencia no se expone. En eventos guardados antes de esta garantía, el orden dentro de una misma hora no se
        conoce y no se reconstruye.
      responses:
        '200':
          description: Eventos, del más reciente al más antiguo; con la misma hora, primero el último emitido.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoHistorial'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /pedidos/{pedidoId}/etapas/{numeroEtapa}/archivos:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
      - $ref: '#/components/parameters/NumeroEtapa'
    get:
      tags: [archivos]
      operationId: listarAdjuntosDeEtapa
      summary: Archivos de una etapa (todas sus entradas)
      x-origen: requisito
      description: |
        Metadatos de los archivos de la etapa, de todas sus entradas (`entradaId` indica a cuál pertenece cada uno).
        Los ve quien puede ver el pedido (P-13); verlos no autoriza a descargar el contenido (P-17).
      responses:
        '200':
          description: Adjuntos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Adjunto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags: [archivos]
      operationId: subirArchivo
      summary: Subir un archivo a la entrada actual de la etapa actual
      x-origen: requisito
      x-pendiente: |
        Formatos aceptados (propuesta: PDF, Word, Excel, imágenes y ZIP; sin confirmar, no se aplica) y límite de
        tamaño (100 MiB por archivo: valor provisional del equipo, configurable; contradicción 7).
      description: |
        Requisito 4.2 #15 y ADR-0003: el servidor recibe el archivo; el navegador nunca llama a Google. En la fase 2
        (P-05 opción A) el archivo se guarda en un almacenamiento local persistente y `estadoCopia` queda PENDIENTE;
        la copia a Drive y sus reintentos son de la fase 3, sobre el mismo módulo.

        - **Permiso (P-06):** quien puede actuar en la etapa actual (persona asignada activa con el rol, o con el rol
          si no hay asignación) o el admin, en una etapa habilitada en esta fase (P-04).
        - **Entrada esperada:** `entradaEsperadaId` debe ser la entrada actual de la etapa
          (`EtapaEnLinea.entradaId`). Si `numeroEtapa` no es la actual, o la etapa volvió a entrar aunque tenga el
          mismo número, la respuesta es 409 ETAPA_CAMBIO.
        - **Metadatos:** el servidor mide el tamaño y calcula el SHA-256 sobre lo recibido y detecta el tipo por el
          contenido; no confía en el `Content-Type` ni en el nombre que envía el cliente. Un archivo vacío o una carga
          incompleta no crea nada.
        - Límite provisional del equipo: 100 MiB por archivo, configurable, pendiente del cliente.
        - La subida reanudable de 3.3 usa las rutas de cargas del mismo módulo; multipart se conserva.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, tipoDocumento, entradaEsperadaId]
              properties:
                archivo:
                  type: string
                  contentMediaType: application/octet-stream
                tipoDocumento:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Tipo de documento según la definición de la etapa (por ejemplo, "Packing List").
                entradaEsperadaId:
                  type: string
                  format: uuid
                  description: Entrada de la etapa que la persona ve en pantalla (`EtapaEnLinea.entradaId`; P-18).
      responses:
        '201':
          description: Archivo recibido; la copia a Drive queda pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adjunto'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '413':
          description: El archivo supera el límite provisional configurado (100 MiB por archivo; contradicción 7).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '415':
          description: Tipo de archivo no aceptado. No se aplica mientras los formatos sigan pendientes del cliente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /pedidos/{pedidoId}/etapas/{numeroEtapa}/archivos/cargas:
    parameters:
      - { name: pedidoId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: numeroEtapa, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 30 } }
    post:
      tags: [archivos]
      operationId: iniciarCargaArchivo
      summary: Iniciar o recuperar una carga propia por clave idempotente
      x-origen: decision-equipo
      description: |
        Implementación de 3.3 encargada por Richard. Propietario y permisos vigentes sobre la entrada actual.
        La clave UUID es única por usuario y comando saneado. Repetir devuelve la misma carga; cambiar el comando
        con la misma clave da 409. No crea un adjunto ni satisface requisitos documentales.
        El límite provisional es 100 MiB (104857600 bytes), no 100 MB decimales. No hay lista cerrada de formatos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InicioCarga' }
      responses:
        '201':
          description: Sesión creada o recuperada, sin registrar un adjunto válido.
          headers:
            Location: { schema: { type: string }, description: Ruta relativa de consulta de esta sesión. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaArchivo' }
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: ETAPA_CAMBIO, CARGA_CONFLICTO, CARGA_INCOMPLETA o CARGA_OCUPADA; consultar progreso antes de continuar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '413':
          description: ARCHIVO_DEMASIADO_GRANDE, archivo mayor de 100 MiB o fragmento mayor de 4 MiB.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: CARGA_ALMACENAMIENTO; no se confirma un adjunto nuevo. Conservar la sesión y contactar al administrador.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /archivos/cargas/{cargaId}:
