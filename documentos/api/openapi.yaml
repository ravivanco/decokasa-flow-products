openapi: 3.1.0
info:
  title: Decokasa — API de seguimiento de pedidos de importación
  version: 0.19.0-borrador
  description: |
    Contrato de la API del MVP (fase 0, paso 0.8). Es la fuente de verdad del límite
    entre frontend y backend: los dos se verifican contra este archivo.

    **Fuentes:** `documentos/requerimientos.md` (fuente de verdad; transiciones en 4.4 y 4.5),
    `.claude/PRPs/prds/decokasa.prd.md`, `documentos/arquitectura.md` y `documentos/adr/`.

    **Cómo distinguir lo aprobado de lo propuesto.** Cada operación y algunos campos llevan:
    - `x-origen: requisito`: lo pide `requerimientos.md`, o sale directamente de un ADR en estado accepted.
    - `x-origen: propuesta`: decisión de diseño del equipo, no aprobada; se puede cambiar.
    - `x-origen: decision-equipo`: configuración acordada expresamente por Richard (OAuth de usuario, paso 3.1).
    - `x-pendiente`: depende de una pregunta abierta del cliente (`requerimientos.md`, "Por confirmar con el cliente"; `arquitectura.md`, 8.1).

    Los nombres de rutas, campos y códigos de error son diseño del contrato y se pueden ajustar
    antes de la fase 1 siguiendo el protocolo de cambio de contrato.

    **Contradicciones entre fuentes (sin resolver):**
    1. Destinatarios de las alertas: el registro de decisiones dice "Gmail al admin" y el valor
       provisional agrega al responsable (ADR-0005). El contrato no expone la configuración de destinatarios.
    2. Tránsito de 45 días: la calculadora lo cuenta en días corridos; `arquitectura.md` usa días
       hábiles como provisional (ADR-0006). El campo `tipoPlazo` admite los dos valores.
    3. Formato del número de pedido: `DK-EC-AAAA-NNNN` es una propuesta pendiente de aprobación; por eso no se fija con `pattern`.
    4. ¿El admin crea pedidos del flujo B? `requerimientos.md` 4.2 #4 dice que los crea David; el
       admin "actúa en cualquier etapa". Queda pendiente; ver `POST /pedidos`.
    5. Actualización entre pantallas (ADR-0014, decisión técnica del equipo, provisional, 2026-10-20): consultas periódicas del frontend sobre este mismo contrato REST, sin WebSocket. Un cambio ajeno puede tardar hasta el intervalo (30 s por defecto) más la petición; no se declara cumplido "al instante" sin aceptación del cliente.
    6. Roles por usuario: resuelto por el equipo (Richard, 2026-10-12), no por el cliente. Un usuario tiene uno o
       varios roles (`Usuario.roles`), que solo asigna el admin (`requerimientos.md` 4.7).
    7. Límite de 100 MB por archivo: `requerimientos.md` 4.2 #15 y la tabla MoSCoW ("Pedido explícito") lo dan como
       requisito, y ADR-0003 lo cita; pero la misma fuente (§5, "Datos y formatos" y "Por confirmar con el cliente")
       mantiene abierta la duda "¿100 MB es por archivo o por etapa?", con la respuesta ambigua "si esta bien", y deja
       "100 MB por archivo" como propuesta. **Valor provisional del equipo (2026-10-15), no confirmado por el
       cliente:** 100 MiB (104 857 600 bytes) por archivo, configurable; el servidor y el proxy aceptan el cuerpo
       multipart con 1 MiB más para el resto del formulario.

    **Cambios del 2026-10-12 (fase 1):** valores de sesión aprobados por el equipo (ADR-0002): bloqueo de 15 min tras
    5 intentos fallidos, acceso de 15 min y renovación hasta 8 h con rotación. El token de renovación viaja en una
    cookie `HttpOnly` (ADR-0002, D3b, aprobado en la versión 0.4.0) y ya no en el cuerpo; se agrega `POST /auth/cerrar-sesion`. El rol
    `consulta` se suma a los roles iniciales.

    **Cambios del 2026-10-12 (fase 1, paso 1.5; versión 0.3.0):** `Usuario.rol` pasa a `Usuario.roles` (lista; decisión
    del equipo). Un usuario sin roles o desactivado no inicia ni renueva sesión.

    **Cambios del 2026-10-12 (fase 1, paso 1.6; versión 0.4.0):** D3b aprobado: cookie de renovación `HttpOnly`,
    `Secure`, `SameSite=Strict` en `/api/v1/auth`, acceso solo en memoria y `Origin` obligatoria en `/auth/renovar`
    y `/auth/cerrar-sesion`. El 409 `DUPLICADO` indica el campo repetido en `errores`.

    **Cambios del 2026-10-13 (fase 1, paso 1.7; versión 0.5.0; D10, aprobado por Richard):** `Usuario.version` (control
    de concurrencia de los datos administrativos) en todas las respuestas que devuelven un usuario, incluidas las de
    sesión. `PATCH /usuarios/{usuarioId}` exige la `version` que leyó el cliente; si ya no es la vigente, responde
    409 `VERSION_DESACTUALIZADA` y no aplica ningún cambio. El inicio de sesión no cambia la versión. Rompe la
    compatibilidad del `PATCH` (todavía no tiene consumidores). Los roles todavía no tienen versión (pendiente).

    **Cambios del 2026-10-15 (fase 2, paso 2.1; versión 0.6.0; decisiones técnicas del equipo, no del cliente):**
    ADR-0004 (definiciones versionadas de flujo en datos) pasa a accepted (equipo). S-1: `DefinicionEtapa.rolResponsable`
    y `EtapaEnLinea.rolResponsable` admiten `null`, solo en etapas automáticas como Fin. Los plazos y documentos que el
    cliente no confirmó siguen pendientes; cómo se exponen (por ejemplo, un plazo o documentos "pendientes" distintos de
    "sin plazo" o "sin documentos") se define en el paso 2.4.

    **Cambios del 2026-10-15 (fase 2, paso 2.4; versión 0.7.0-borrador).** Decisiones provisionales del equipo,
    pendientes de confirmación del cliente: P-13 (consulta de pedidos), P-17 (descarga por el servidor) y P-18
    (requisitos solo con archivos de la entrada actual). P-05 opción A (archivos reales en la fase 2) es decisión del
    equipo. **Compatibilidad:** varios campos nuevos son obligatorios y `PedidoDetalle.accionesDisponibles` cambia de
    tipo (de lista de acciones a lista de objetos), así que los consumidores y sus pruebas deben actualizarse aunque
    la mayoría de los cambios agreguen campos. Todavía no hay consumidores en producción.
    - Estado del plazo explícito (`estadoPlazo`: DEFINIDO, SIN_PLAZO o PENDIENTE) en `DefinicionEtapa` y `EtapaEnLinea`.
    - `DefinicionAccion.requisitosDocumentales` (DEFINIDOS o PENDIENTES): una lista vacía con PENDIENTES no significa
      "sin documentos".
    - `DefinicionEtapa.revisaEtapa`: etapa cuyos archivos revisa esta etapa (P-17). En la fase 2 solo A3 revisa A2.
    - `DefinicionEtapa.registraLlegada` (0.9.1, ADR-0018): etapa de llegada a aduana; su APROBAR registra
      `PedidoDetalle.llegadaAduanaEn`. En el flujo A vigente, solo A7.
    - `EtapaEnLinea.entradaId` y `Adjunto.entradaId`: identificador estable de cada entrada a una etapa (P-18).
    - `EtapaEnLinea.asignacionVigente`: null sin persona asignada; true si la persona asignada puede actuar; false si
      ya no puede (P-06: entonces solo actúa el admin).
    - `accionesDisponibles` estructurado (`AccionDisponible`): requisitos, documentos faltantes y si puede completarse.
    - `EventoHistorial.rolIntervencion` (null en eventos del sistema) y `EventoHistorial.detalle`.
    - Subida con `entradaEsperadaId`; descarga nueva `GET /archivos/{adjuntoId}/contenido`; código
      `ARCHIVO_NO_DISPONIBLE`; 403 en las consultas para cuentas inactivas o sin roles.

    **Cambios del 2026-10-20 (fase 5, paso 5.1; versión 0.11.0-borrador; F5-D1 opción A, aprobada por Richard como
    decisión del equipo).** `Cronograma` se rediseña antes de tener consumidores: fechas planificada, estimada y real por
    separado, `estado` y `procedencia` por etapa, `llegada` con su procedencia, `totalDias` y `diferenciaContraMeta`
    anulables, `calculable` y `faltantes`. Un plazo PENDIENTE no es cero ni SIN_PLAZO: deja "sin estimar" su etapa y
    las que dependen de ella hasta un dato de llegada válido (la real prevalece sobre la estimada). `ConfiguracionPlazos`
    agrega `origenMeta`, `metaPendienteDelCliente`, `actualizadoEn` y `version` (409 si cambió); los feriados siguen
    pendientes del cliente y un PUT que los traiga se rechaza con 400.
    **Contradicción documentada (no resuelta en el PRD):** la señal de éxito de la fase 5 del PRD dice que "el
    cronograma del caso base de la calculadora da las mismas fechas con la regla de días hábiles"; la calculadora suma
    días corridos (requerimientos 1.8) y el manual (paso 5.1) prohíbe copiar sus fechas como resultado del cálculo
    hábil. Este contrato sigue el manual y ADR-0006: las fechas salen de los plazos de cada etapa con días u horas
    hábiles, y las etapas sin plazo del cliente no toman los 8 + 31, 12 ni 45 días de la calculadora.

    **Cambios del 2026-10-20 (fase 5, paso 5.2; versión 0.12.0-borrador; reglas aprobadas provisionalmente por
    Richard como decisión del equipo, no del cliente).** Nuevo `PUT /pedidos/{pedidoId}/etapas/{numeroEtapa}/motivo-retraso`
    (F5-D3) y tipo de evento `MOTIVO_RETRASO_REGISTRADO`. `PLAZO_VENCIDO` se registra por cada plazo vencido (ETAPA o
    URGENCIA, F5-D4) con `detalle.claseVencimiento` y `detalle.venceEn`. `PedidoResumen.motivoRetraso` devuelve el motivo
    vigente. Los avisos al admin salen por el outbox (`notificacion`, plantilla VENCIMIENTO); sin destinatario
    configurado queda la fila con destinatario nulo (bloqueo explícito). La detección automática está desactivada por
    defecto hasta su verificación.

    **Cambios del 2026-10-20 (fase 5, paso 5.3; versión 0.13.0-borrador).** `GET /pedidos/bandeja` acepta los filtros
    opcionales `vencido` y `conUrgencia` del dashboard; `Urgencia.vencida` dice si la urgencia vigente ya venció, decidido
    por el servidor. Solo se agregan campos y parámetros opcionales.

    **Cambios del 2026-10-21 (documentos de A6, A9 y A10, confirmados por Richard; V16; versión 0.14.0-borrador).**
    A6 exige al menos un documento de tipo "Packing List"; el BL y otros adjuntos son opcionales. A9 y A10 exigen al menos
    un documento de cualquier tipo, sin tipo comercial fijo y sin excepción "sin incidencias". Las tres transiciones pasan
    de `PENDIENTES` a `DEFINIDOS`. `DefinicionAccion` y `AccionDisponible` agregan `exigeAlgunDocumento`; si falta ese
    documento, `faltantes` y `documentosFaltantes` incluyen "al menos un documento". Solo se agrega un campo.

    **Cambios del 2026-10-21 (fase 6, pasos 6.1 y 6.2; V17; versión 0.15.0-borrador).** Flujo B de Ecuador, versión 1,
    vigente: `GET /flujos/EC/B` devuelve sus 12 etapas. `POST /pedidos` con `tipoFlujo: B` lo crea solo quien tiene,
    vigente en la base, el rol `compras_china` (responsable de B1). El rol `admin` por sí solo recibe 403 al crear B
    (P-14 sigue pendiente); un admin que también tenga `compras_china` lo crea por ese rol. La creación del flujo A no
    cambia. B1 ENVIAR exige "Solicitud" (decisión de Richard del 2026-10-21) y B2 RECHAZAR vuelve a B1 con observación
    obligatoria. Sin cambios de esquema.

    **Cambios del 2026-10-22 (fase 7, paso 7.1; versión 0.16.0-borrador; sin implementar).** Chat de consulta de solo
    lectura con Claude API para el **piloto con datos ficticios** (ADR-0020 a ADR-0023, aprobados por Richard para el
    piloto). Nueva etiqueta `asistente`: abrir una conversación sobre **un único pedido**, preguntar, listar y leer las
    conversaciones propias, y consumo para el admin. Nuevos códigos `CONTEXTO_EXCEDIDO`, `LIMITE_PREGUNTAS`,
    `LIMITE_CONSUMO` e `IA_NO_DISPONIBLE`. No hay backend todavía; la IA está desactivada (`IA_HABILITADA=false`).
    Colombia sigue fuera de este contrato hasta sus definiciones. Pendiente (F7-D6): documentos reales, conservación en
    producción y revisión de la retención del proveedor.

    **Cambios del 2026-10-22 (fase 7, paso 7.2; V19; versión 0.17.0-borrador; sin verificar).** Colombia con los mismos
    flujos A y B que Ecuador (decisión de Richard): `GET /flujos/CO/A` y `GET /flujos/CO/B` devuelven sus definiciones
    v1 (iguales a EC v1 salvo "Aduana Colombia"). **Acceso por país (ADR-0024):** cada operación sobre pedidos, archivos,
    historial, cronograma y bodegas usa los países asignados hoy en la base (`usuario_pais`), también para el admin. Un
    pedido de un país no asignado responde **404**, como uno inexistente; los listados y la bandeja solo devuelven pedidos
    de los países asignados. `POST /pedidos` acepta `pais: CO` si el país está asignado (si no, 403); la numeración es
    por país (`DK-CO-AAAA-NNNN`, formato pendiente como `DK-EC`). Bodegas por país: `Bodega` agrega `pais` y `ciudad`
    puede ser nula mientras está pendiente ("Bodega 1" de Colombia); `GET /bodegas` acepta `pais` y solo devuelve
    bodegas de los países asignados; `POST /bodegas` acepta `pais` (por defecto EC); el nombre es único por país; al
    elegir bodega, debe ser del país del pedido (400 en `bodegaId`). Calendario: mismas reglas provisionales, configuradas
    por país. Los países los asigna el admin con `PATCH /usuarios/{id}` (`paises`); ninguna cuenta recibe Colombia
    automáticamente. **Paso 7.3:** `GET /pedidos`, `/pedidos/bandeja`, `/pedidos/buscar`, `/notificaciones` y
    `/archivos/copias-fallidas` aceptan `pais` (el país seleccionado en la pantalla), validado contra los asignados hoy
    (403 si no). Vistas del admin: `GET /notificaciones` y `GET /archivos/copias-fallidas` solo muestran registros
    de pedidos de los países asignados hoy al admin, con la paginación y el total filtrados en el servidor; los registros
    no se borran ni se reasignan. "Sin país equivale a EC" es solo compatibilidad documentada (por ejemplo, `pais`
    ausente en `POST /pedidos` o `POST /bodegas` se interpreta como EC) y nunca omite la autorización: sin EC asignado,
    403.

    **Cambios del 2026-10-22 (fase 7, paso 7.4; V20; versión 0.18.0-borrador; sin verificar).** Backend del asistente
    con Claude API para el piloto. **Publicadas** (no llaman al modelo): `POST /pedidos/{pedidoId}/asistente/conversaciones`,
    `GET /asistente/conversaciones` (ahora con `pais`, el país seleccionado: 403 si no está asignado hoy) y
    `GET /asistente/conversaciones/{conversacionId}`. **Sin publicar hasta el paso 7.5**: `POST
    /asistente/conversaciones/{conversacionId}/mensajes` y `GET /asistente/consumo`, que esperan la reserva de presupuesto
    y los controles (ADR-0022); hasta entonces esas rutas no existen en el servidor (404). Una conversación ajena, vencida
    o de un país no asignado responde 404. Con `IA_HABILITADA=false` (el valor por defecto), abrir responde 503
    `IA_NO_DISPONIBLE`. Ningún documento se envía fuera del entorno `PILOTO_FICTICIO` (F7-D3; documentos reales
    pendientes de F7-D6).

    **Cambios del 2026-10-22 (fase 7, paso 7.5; V21; versión 0.19.0-borrador; sin verificar).** Controles del piloto
    (ADR-0022, límites de F7-D2). **Publicadas**: `POST /asistente/conversaciones/{conversacionId}/mensajes` y
    `GET /asistente/consumo` (admin), más `GET`/`POST /asistente/tarifas`, `POST /asistente/tarifas/{tarifaId}/validacion`
    y `GET`/`PATCH /asistente/configuracion` (admin). Preguntar responde 503 `IA_NO_DISPONIBLE` **antes de cualquier
    llamada al proveedor** (incluida count_tokens) mientras falte un control: `IA_HABILITADA=true` con clave y modelo, el
    interruptor de la base activado, y la tarifa vigente del modelo **validada** por un admin. La tarifa de
    `claude-haiku-5-5` se siembra desde la documentación oficial de precios (consultada el 2026-10-22) **sin validar**.
    Límites: 60 000 tokens de entrada medidos con count_tokens (los PDF que no caben se excluyen con
    `CONTEXTO_EXCEDIDO`; si ni sin PDF cabe, 400 `CONTEXTO_EXCEDIDO`), `max_tokens` 4 000, 10 preguntas, 20 consultas
    por usuario y día con 1 en curso, 200 diarias y US$10 al mes, con reserva atómica del peor caso (429
    `LIMITE_CONSUMO`). El límite de gasto del proveedor desactiva el asistente (503) hasta que un admin lo reactive; que el
    servidor maneje ese error no significa que el límite de US$15 del workspace esté configurado en la Console. Los
    importes van como texto decimal con 6 decimales (micro-USD). No se envía `Retry-After`.

    **Permisos (resumen).** Los permisos se validan siempre en el servidor (ADR-0002, R6), con el estado y los roles
    actuales de la persona en la base, no con los roles del token.
    - Leer pedidos (listar, buscar, detalle y línea de tiempo): usuarios activos con al menos un rol vigente; las
      cuentas desactivadas o sin roles reciben 403. **P-13, provisional del equipo** para desarrollo con datos
      ficticios, pendiente de confirmación del cliente. Ver un pedido no autoriza por sí solo a descargar archivos.
    - Actuar sobre la etapa actual y subir archivos: **P-06 (decisión del equipo)**. Sin persona asignada, cualquier
      usuario activo con el rol responsable de la etapa, o el admin; con persona asignada, solo ella (activa y con el
      rol) o el admin. `consulta` y `asistente_china` no conceden acciones, pero no quitan las de otros roles.
    - Descargar un archivo: **P-17, provisional del equipo**. El admin, quien puede actuar en la etapa del archivo y
      quien puede actuar en la etapa que la revisa (`DefinicionEtapa.revisaEtapa`).
    - Historial de un pedido: igual que leer el pedido (P-13, provisional del equipo). Bodegas y definiciones de flujo:
      cualquier usuario autenticado (requisito 4.2 #17).
    - Agregar observaciones: **P-19, provisional del equipo** (la fuente no dice quién). Quien puede actuar en la etapa
      actual (P-06) o el admin, con estado, roles y asignación vigentes; `consulta` y `asistente_china` no conceden
      escritura ni quitan la de otros roles.
    - Asistente (0.16.0, piloto): F7-D4, aprobada por Richard. Pueden usarlo `admin`, `asistente_compras`, `marketing`,
      `compras_china` y `logistica`; `consulta` y `asistente_china` no dan acceso por sí solos, pero no quitan el de
      otro rol. Antes de enviar datos al modelo **y** antes de devolver una conversación guardada, el servidor comprueba
      cuenta, país, pedido (P-13) y descarga de cada documento (P-17), con el estado vigente en la base. Cada
      conversación solo la ve su autor. El admin ve el consumo, no textos ajenos.
    - País (0.17.0, ADR-0024): además de lo anterior, todo pedido, archivo, cronograma, historial y bodega se limita a
      los países asignados hoy en la base; el admin no tiene excepción. Fuera de ese alcance, 404 en pedidos y 403 al
      pedir explícitamente un país no asignado (bodegas, creación).
    - Usuarios, roles, auditoría, notificaciones, vencidos y cambiar la configuración de plazos: solo el admin. Desde
      0.17.0, notificaciones y copias fallidas, además, solo de pedidos de los países asignados hoy al admin. Leer
      la configuración de plazos: cualquier usuario autenticado. Cronograma de un pedido: igual que leer el pedido (P-13).

    **Revisión:** revisado con `/ecc:api-design` el 2026-10-10 contra requerimientos, PRD, arquitectura y ADR.

    **Fuera de este contrato:** selector de país en pantalla (fase 7, paso 7.3), consultas del asistente
    sobre varios pedidos (F7-D1), pausar o cancelar
    pedidos y el checklist por etapa (pendientes de confirmar), y la subida reanudable por partes
    (propuesta de `arquitectura.md`, se define en la fase 3).
  contact:
    name: Equipo Decokasa
  license:
    name: Uso interno de DECOKASA S.A.S.
    identifier: LicenseRef-Propietario
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local. El servidor de producción se define en la fase 8.
tags:
  - name: autenticacion
    description: Inicio de sesión con JWT (ADR-0002).
  - name: usuarios
    description: Usuarios; solo el admin los gestiona.
  - name: roles
    description: Roles como datos; solo el admin los gestiona.
  - name: flujos
    description: Definiciones de flujo y etapa (solo lectura).
  - name: pedidos
    description: Crear, listar, buscar y ver pedidos con su línea de tiempo.
  - name: acciones
    description: Transiciones de etapa y reasignación.
  - name: observaciones
    description: Observaciones por etapa.
  - name: archivos
    description: Archivos por etapa, copiados a Google Drive desde el servidor.
  - name: bodegas
    description: Catálogo de bodegas.
  - name: plazos
    description: Cronograma, vencimientos y configuración de plazos.
  - name: historial
    description: Eventos inmutables por pedido y auditoría global.
  - name: notificaciones
    description: Registro de correos enviados, pendientes y fallidos.
  - name: asistente
    description: Chat de consulta de solo lectura con Claude API sobre un pedido (fase 7, piloto con datos ficticios).
security:
  - bearerAuth: []

paths:
  /integraciones/google/oauth2/inicio:
    post:
      tags: [archivos]
      operationId: iniciarAutorizacionGoogle
      summary: Iniciar el consentimiento OAuth de la cuenta Google de empresa
      x-origen: decision-equipo
      x-roles: [admin]
      description: |
        Paso 3.1, decisión de Richard de 2026-10-17. Solo admin activo con rol vigente en la base.
        Cliente web OAuth de usuario, Gmail personal y Mi unidad; sin delegación Workspace.
        Requiere GOOGLE_OAUTH_HABILITADA=true y configuración privada externa.
        Solicita acceso offline, state de un solo uso (cinco minutos), nonce y PKCE S256.
        Establece cookie host-only HttpOnly SameSite=Lax de vínculo de navegador, con Path restringido.
        No intercambia códigos al iniciar, no envía correos ni crea archivos. La URL es para navegar
        en el mismo navegador que recibió la cookie; no compartirla ni registrarla en logs.
      responses:
        '200':
          description: Inicio preparado; navegar a Google desde este navegador antes de caducaEn.
          headers:
            Set-Cookie:
              description: Cookie temporal de vínculo, no contiene tokens Google.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [urlAutorizacion, caducaEn]
                properties:
                  urlAutorizacion:
                    type: string
                    format: uri
                    description: URL de accounts.google.com con state y challenge; sin secretos ni tokens.
                  caducaEn:
                    $ref: '#/components/schemas/FechaHora'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '503':
          description: GOOGLE_NO_DISPONIBLE. Configuración externa incompleta o permisos privados no admitidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /integraciones/google/oauth2/callback:
    get:
      tags: [archivos]
      operationId: completarAutorizacionGoogle
      summary: Retorno OAuth local con estado y cookie de vínculo obligatorios
      x-origen: decision-equipo
      security: []
      description: |
        URI exacta registrada: http://localhost:8080/api/v1/integraciones/google/oauth2/callback.
        No exige Bearer porque Google redirige el navegador; sí consume state vivo de un solo uso,
        valida la cookie del navegador y reconsulta al admin iniciador antes del canje y del guardado.
        El backend canjea por HTTPS y valida el ID token y los ámbitos. Cifra tokens fuera de Git.
        Google En pruebas limita la autorización/refresh token de Gmail/Drive a siete días.
        Siempre redirige a resultado local sin propagar códigos, state, errores del proveedor ni tokens.
        Si la integración está deshabilitada, no existe este controlador.
      parameters:
        - name: state
          in: query
          schema:
            type: string
          description: Estado emitido por inicio, de un solo uso. No registrar el valor.
        - name: code
          in: query
          schema:
            type: string
          description: Código OAuth. No registrar ni compartir; ausencia/cancelación produce resultado de error.
        - name: error
          in: query
          schema:
            type: string
          description: Denegación del proveedor, nunca se refleja en el cuerpo ni en la URL de resultado.
        - name: decokasa_google_inicio
          in: cookie
          schema:
            type: string
          description: Cookie HttpOnly del navegador que inició el flujo.
      responses:
        '303':
          description: Borra la cookie y redirige al resultado local (200, 400, 403 o 503), sin datos sensibles.
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/integraciones/google/oauth2/resultado?codigo=200, 400, 403 o 503.

  /integraciones/google/oauth2/resultado:
    get:
      tags: [archivos]
      operationId: mostrarResultadoAutorizacionGoogle
      summary: Página local informativa sin credenciales
      x-origen: decision-equipo
      security: []
      description: |
        No consulta tokens ni cuenta y no acredita el estado actual de conexión si se abre directamente.
        Textos constantes, Cache-Control no-store y CSP sin recursos externos. No envía ni sube contenido.
      parameters:
        - name: codigo
          in: query
          schema:
            type: string
            default: '400'
      responses:
        '200':
          description: Mensaje del retorno satisfactorio.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Estado inválido/caducado, cancelación u otro retorno inválido; HTML sin secretos.
        '403':
          description: El admin iniciador perdió su autorización; HTML sin secretos.
        '503':
          description: Configuración, proveedor o almacén no disponibles; HTML sin secretos.


  /auth/login:
    post:
      tags: [autenticacion]
      operationId: iniciarSesion
      summary: Iniciar sesión con correo, nombre de usuario o teléfono
      x-origen: requisito
      description: |
        Requisito 4.2 #1 y ADR-0002 (JWT + BCrypt). El identificador puede ser el correo, el nombre
        de usuario o el teléfono. Credenciales incorrectas y usuario desactivado responden igual
        (401), para no revelar qué cuentas existen. Un usuario sin roles tampoco inicia sesión (401); un usuario
        puede tener uno o varios roles (decisión del equipo, `requerimientos.md` 4.7).
        **Decidido por el equipo (ADR-0002, 2026-10-12):** tras 5 intentos fallidos de contraseña, la cuenta
        queda bloqueada 15 minutos (respuesta 423). El token de acceso dura 15 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudInicioSesion'
      responses:
        '200':
          description: Sesión iniciada. El token de acceso va en el cuerpo; el de renovación, en la cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieRenovacion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSesion'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '423':
          description: 'Cuenta bloqueada 15 minutos tras 5 intentos fallidos (código CUENTA_BLOQUEADA; ADR-0002).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

  /auth/renovar:
    post:
      tags: [autenticacion]
      operationId: renovarSesion
      summary: Renovar el token de acceso
      x-origen: requisito
      description: |
        ADR-0002 (decisión del equipo, 2026-10-12): la sesión se renueva hasta 8 horas desde el inicio
        de sesión. Cada llamada entrega un token de acceso nuevo y rota el token de renovación (la cookie
        anterior queda revocada). Si llega un token ya revocado, se revoca toda la sesión y responde 401.
        Si la cuenta está desactivada o ya no tiene roles, también responde 401 y revoca la sesión
        (decisión del equipo, `requerimientos.md` 4.7).
        **D3b (aprobado el 2026-10-12, ADR-0002):** el token de renovación viaja en la cookie
        `decokasa_renovacion` y nunca en el cuerpo. Sin cookie, o con una cookie desconocida, revocada o
        vencida, responde 401. El servidor exige la cabecera `Origin` y que esté en `CORS_ORIGENES`; si falta
        o no está, responde 403 `SIN_PERMISO` sin tocar la sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/Origen'
        - $ref: '#/components/parameters/CookieRenovacion'
      responses:
        '200':
          description: Token renovado; la cookie se reemplaza por una nueva con el tiempo que queda de las 8 horas.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieRenovacion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSesion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /auth/cerrar-sesion:
    post:
      tags: [autenticacion]
      operationId: cerrarSesion
      summary: Cerrar la sesión
      x-origen: requisito
      description: |
        D3b (aprobado el 2026-10-12, ADR-0002): revoca el token de renovación de esta sesión y borra la
        cookie (`Max-Age=0`). Responde 204 aunque la cookie falte o ya esté revocada. El token de acceso sigue
        válido hasta que vence (como máximo 15 minutos); el frontend lo descarta de la memoria. Exige `Origin`
        igual que `/auth/renovar` (403 si falta o no está permitido).
      security: []
      parameters:
        - $ref: '#/components/parameters/Origen'
        - $ref: '#/components/parameters/CookieRenovacion'
      responses:
        '204':
          description: Sesión cerrada; la cookie se borra.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieRenovacion'
        '403':
          $ref: '#/components/responses/SinPermiso'

