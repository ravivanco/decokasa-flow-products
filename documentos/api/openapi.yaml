        longitud completa y SHA-256; solo detecta firma técnica, sin interpretar contenido comercial ni filtrar
        extensiones por una lista no aprobada. Adjunto y ARCHIVO_SUBIDO/SUBIDO y sesión COMPLETADA comparten
        transacción. Una repetición ya completada devuelve el mismo Adjunto, sin otro evento, siempre que el
        propietario mantenga acceso de consulta. Un parcial nunca satisface un requisito documental.
        Los bytes se conservan en el volumen de fase 2, sin crear carpetas de Drive ni activar OAuth.
      responses:
