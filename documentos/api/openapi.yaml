  /pedidos/{pedidoId}/acciones:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    post:
      tags: [acciones]
      operationId: ejecutarAccionEtapa
      summary: Ejecutar una acción sobre la etapa actual del pedido
      x-origen: requisito
      description: |
        Transiciones de `requerimientos.md` 4.4 (flujo A) y 4.5 (flujo B). El servidor valida el rol
        o la asignación (o el admin), que la acción esté permitida en la etapa actual y sus requisitos.

        | Etapa | Acciones permitidas | Destino | Requisitos |
        | --- | --- | --- | --- |
        | A1 / B1 | ENVIAR | A2 / B2 | "Solicitud" adjunta (A1; B1 por decisión de Richard, 2026-10-21). El producto propuesto en B1 puede adjuntarse como documento adicional |
        | B2 | APROBAR / RECHAZAR | B3 / B1 | RECHAZAR: observación obligatoria; vuelve a B1 con una entrada nueva |
        | A2 / B3 | ENVIAR | A3 / B4 | Documentos codificados adjuntos |
        | A3 / B4 | APROBAR / RECHAZAR | A4 / B5 — A2 / B3 | RECHAZAR: observación |
        | A4 / B5 | APROBAR / DEVOLVER_POR_ERROR / DEVOLVER_POR_PRODUCTO_NUEVO | A5 / B6 — A2 / B3 — A2 / B3 | Devolver: observación; por producto nuevo, además, urgencia |
        | A5 / B6 | APROBAR | A6 / B7 | Observación |
        | A6 / B7 | APROBAR | A7 / B8 | Al menos un "Packing List" adjunto; BL y otros, opcionales (V16) |
        | A7 / B8 | APROBAR / REPORTAR_DEMORA | A8 / B9 — se queda | Demora: observación y nueva fecha |
        | A8 / B9 | APROBAR | A9 / B10 | — |
        | A9 / B10 | APROBAR | A10 / B11 | `bodegaId` de una bodega activa (F4-D2) y al menos un documento de cualquier tipo (V16) |
        | A10 / B11 | APROBAR | A11 / B12 (Fin automático) | Al menos un documento de cualquier tipo (V16); sin excepción "sin incidencias" |

        Las filas de A6, A9 y A10 rigen para el flujo A de Ecuador (V16); el flujo B se siembra en la fase 6.

        La urgencia (4, 12 o 24 h) tiene su propio vencimiento hasta volver a A4 / B5 (requisito 4.2 #11).
        El campo `etapaEsperada` evita actuar sobre una etapa que otro usuario ya movió (propuesta de diseño).

        **Documentos (P-05 opción A y P-18).** Los documentos obligatorios se acreditan solo con `adjuntoIds` de
        archivos reales subidos a la **entrada actual** de la etapa (`EtapaEnLinea.entradaId`). Un identificador que
        no existe, es de otro pedido, de otra etapa o de una entrada anterior, o cuyo archivo no está disponible en el
        almacenamiento, responde **400** (`errores[].campo = adjuntoIds`); nunca se ignora. Si los identificadores son
        válidos pero falta un tipo obligatorio, o la acción exige al menos un documento (`exigeAlgunDocumento`) y no se
        adjuntó ninguno, responde **422** con `faltantes` ("al menos un documento" en el segundo caso). Se pueden adjuntar
        documentos adicionales de cualquier tipo. Los archivos aceptados quedan en
        `EventoHistorial.adjuntoIds` del evento de la acción. El texto de una observación no reemplaza un documento.

        **Demora y llegada en aduana (F4-D5, provisional del equipo, pendiente de confirmación del cliente; 0.9.0).**
        `REPORTAR_DEMORA` lo pide quien puede actuar en A7 (P-06: Compras China o el admin) y exige `observacion` y
        `nuevaFechaEstimadaLlegada` (si faltan, 422 con `faltantes`). Primero la fecha pasa al lunes si cae en sábado o
        domingo; después la fecha efectiva no puede ser anterior a hoy en Ecuador ni, si ya había una demora, igual o
        anterior a la estimación vigente (400 en `nuevaFechaEstimadaLlegada`). El pedido no cambia de etapa ni de
        plazo: la fecha es una estimación (`PedidoDetalle.demoraAduana`), no un vencimiento, y A7 sigue con plazo
        `PENDIENTE`. Cada demora queda en el historial (`DEMORA_REPORTADA`) con la estimación anterior y, si es
        distinta, la fecha solicitada. `APROBAR` en A7 es el check de llegada: guarda `llegadaAduanaEn` con la hora
        del servidor y pasa a A8. La etapa de llegada es la marcada con `DefinicionEtapa.registraLlegada` (ADR-0018),
        no la que admite `REPORTAR_DEMORA`. A7 solo se alcanza si A6 avanza; desde V16, A6 avanza con al menos un "Packing List"
        adjunto (F4-D4, confirmado por Richard el 2026-10-21).

        **Bodega (F4-D2, provisional del equipo, pendiente de confirmación del cliente; 0.10.0).** La bodega se elige
        únicamente con el `APROBAR` de A9, con `bodegaId` (quien puede actuar en A9 según P-06: Logística o el admin).
        Sin `bodegaId`, 422 con `faltantes: [bodega]`; una bodega inexistente o inactiva, también si se desactiva
        mientras se confirma, 400 en `bodegaId`; `bodegaId` con otra acción, 400. La bodega, el avance a A10 y los
        eventos `BODEGA_ASIGNADA` y `ETAPA_APROBADA` se guardan juntos; se asigna una sola vez y no se cambia después
        (cambiarla queda pendiente del cliente). Desde V16 (F4-D7), `APROBAR` en A9 exige además al menos un documento de
        cualquier tipo de la entrada actual; si falta, 422 con `faltantes` y no se guarda ninguna bodega. `ELEGIR_BODEGA`
        no se usa.

        **Incidencias y Fin (paso 4.5; documentos desde V16).** A10 admite la acción APROBAR de Logística o admin
        vigente (P-06) y exige al menos un documento de cualquier tipo (F4-D8, confirmado por Richard el 2026-10-21; sin
        excepción "sin incidencias"); sin él, 422 con `faltantes` y el pedido no se cierra. Su plazo sigue PENDIENTE.
        Con el requisito cumplido, APROBAR completa A10 y
        Fin automáticamente en la misma transacción: pedido finalizado, ninguna etapa ACTUAL, Fin COMPLETADA
        con entrada y salida a la hora del servidor, sin vencimiento. Además de la aprobación por la persona,
        se registra PEDIDO_FINALIZADO como evento del sistema, sin usuario ni rol. Un pedido finalizado y A11
        no admiten acciones manuales.
        No se agrega un aviso específico de Fin ni se definen destinatarios (F4-D9 pendiente).
        El orden relativo de eventos con la misma hora sigue pendiente (F4-H01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAccion'
            examples:
              rechazarRevision:
                summary: Marcela rechaza en A3
                value:
                  accion: RECHAZAR
                  etapaEsperada: 3
                  observacion: Las medidas del modelo 2 no coinciden con la ficha.
              devolverUrgente:
                summary: David devuelve por producto nuevo con urgencia
                value:
                  accion: DEVOLVER_POR_PRODUCTO_NUEVO
                  etapaEsperada: 4
                  observacion: La fábrica propone un modelo nuevo; codificarlo.
                  nivelUrgencia: URGENTE
      responses:
        '200':
          description: Acción ejecutada; devuelve el pedido actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDetalle'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/RequisitoFaltante'

