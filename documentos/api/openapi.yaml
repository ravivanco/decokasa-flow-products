        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: ETAPA_CAMBIO, CARGA_CONFLICTO, CARGA_INCOMPLETA o CARGA_OCUPADA; consultar progreso antes de continuar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '413':
          description: ARCHIVO_DEMASIADO_GRANDE, archivo mayor de 100 MiB o fragmento mayor de 4 MiB.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: CARGA_ALMACENAMIENTO; no se confirma un adjunto nuevo. Conservar la sesión y contactar al administrador.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /archivos/{adjuntoId}/contenido:
    get:
      tags: [archivos]
      operationId: descargarArchivo
      summary: Descargar el archivo a través del servidor
      x-origen: propuesta
      description: |
        P-17 (provisional del equipo, pendiente de confirmación del cliente). Pueden descargar el admin, quien puede
        actuar en la etapa del archivo y quien puede actuar en la etapa que la revisa (`DefinicionEtapa.revisaEtapa`;
        en la fase 2 solo A3 revisa A2), con el estado, los roles y las asignaciones vigentes. `consulta` y
        `asistente_china` no conceden descarga, pero no quitan permisos que den otros roles. Ver el pedido no basta.

        El servidor comprueba que el archivo esté completo y que su SHA-256 coincida antes de entregarlo; si falta o
        no coincide, responde 409 `ARCHIVO_NO_DISPONIBLE` y nunca entrega un archivo inválido. Siempre se entrega como
        `application/octet-stream` con `Content-Disposition: attachment` y `X-Content-Type-Options: nosniff`: el tipo
        declarado por quien subió el archivo no se usa. La accesibilidad real de Drive desde China queda pendiente de
        verificar; esta descarga no depende de Drive.
      parameters:
        - name: adjuntoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contenido del archivo.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El archivo no está disponible o está dañado (ARCHIVO_NO_DISPONIBLE).
          content:
            application/problem+json:
