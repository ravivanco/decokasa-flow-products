  /asistente/conversaciones/{conversacionId}/mensajes:
    parameters:
      - $ref: '#/components/parameters/ConversacionId'
    post:
      tags: [asistente]
      operationId: preguntarAsistente
      summary: Hacer una pregunta en la conversación
      x-origen: decision-equipo
      x-decision: 'F7-D2 a F7-D5 y ADR-0020 a ADR-0023, aprobados por Richard el 2026-10-22 para el piloto.'
      description: |
        Solo lectura: no modifica pedidos ni ejecuta acciones. Orden: permisos vigentes (como en la lectura de la
        conversación) → documentos elegibles (descarga P-17, PDF por contenido, en el manifiesto del piloto) →
        contexto ≤ 60 000 tokens → reserva de presupuesto → llamada → validación de referencias → registro.

        - **Referencias verificadas.** Cada referencia corresponde a un documento autorizado **enviado en esta
          consulta** y a una página que existe en ese PDF. Las que no cumplen se descartan y no cuentan como evidencia.
          Si no queda ninguna válida, `evidenciaSuficiente: false` y la respuesta lo dice.
        - **Historial.** A partir del segundo turno solo se reenvían los mensajes cuyas fuentes siguen autorizadas.
        - `documentosExcluidos` solo lista documentos que el usuario puede descargar, para no revelar los demás.
        - Sin modelo, claves ni detalles del proveedor en la respuesta. Sin streaming.
        - Límites del piloto (F7-D2): 10 preguntas por conversación; 20 consultas por usuario y día, con 1 en curso;
          200 consultas diarias; presupuesto mensual. Al superarlos, 429 `LIMITE_CONSUMO` o 400 `LIMITE_PREGUNTAS`,
          sin llamar al modelo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaAsistente'
      responses:
        '200':
          description: Respuesta del asistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAsistente'
        '400':
          description: |
            `VALIDACION`, `CONTEXTO_EXCEDIDO` (la pregunta, el pedido o los documentos no caben en 60 000 tokens) o
            `LIMITE_PREGUNTAS` (la conversación llegó a 10 preguntas).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteConsumo'
        '503':
