        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: ETAPA_CAMBIO, CARGA_CONFLICTO, CARGA_INCOMPLETA o CARGA_OCUPADA; consultar progreso antes de continuar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '413':
          description: ARCHIVO_DEMASIADO_GRANDE, archivo mayor de 100 MiB o fragmento mayor de 4 MiB.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: CARGA_ALMACENAMIENTO; no se confirma un adjunto nuevo. Conservar la sesión y contactar al administrador.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /archivos/cargas/{cargaId}/fragmentos:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [archivos]
      operationId: recibirFragmentoCarga
      summary: Conservar un bloque secuencial de hasta 4 MiB de una carga propia
      x-origen: decision-equipo
      description: |
        Bloques de 4194304 bytes salvo el último. Content-Range, longitud real y SHA-256 deben coincidir.
        Reenvío idéntico de un bloque ya confirmado devuelve el mismo progreso sin concatenar otra vez.
        Huecos, total distinto, rango divergente o huella distinta dan 409. No se aceptan bloques en COMPLETADA.
        Serialización por sesión y force a disco antes del commit de offset/huella. Una caída puede dejar tail
        no confirmado: se trunca al offset de base antes de la siguiente escritura, bajo el mismo bloqueo.
      parameters:
        - name: Content-Range
          in: header
          required: true
          schema: { type: string, pattern: '^bytes [0-9]{1,9}-[0-9]{1,9}/[0-9]{1,9}$' }
        - name: X-Fragmento-SHA256
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Bloque confirmado o reenvío idéntico reconocido.
          content:
            application/json:
