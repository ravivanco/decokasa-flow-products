  /pedidos/{pedidoId}/cronograma:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    get:
      tags: [plazos]
      operationId: obtenerCronograma
      summary: Cronograma del pedido contra la meta de días
      x-origen: requisito
      x-decision: 'F5-D1 opción A, aprobada por Richard el 2026-10-20 como decisión del equipo.'
      description: |
        Reemplaza la calculadora actual (respuestas del cliente) sin copiar sus fechas: la calculadora sumaba días
        corridos y solo movía al lunes la fecha final (requerimientos 1.8). Aquí cada etapa usa su plazo definido con
        el calendario laboral (días u horas hábiles con la hora de Ecuador, o corridos si la etapa lo declara;
        ADR-0006); una fecha en fin de semana pasa al lunes y un retraso arrastra las siguientes.

        - Cada etapa termina en una fecha **real** (salida o llegada registrada), **estimada** (llegada estimada por
          demora, F4-D5; no es un vencimiento) o **planificada** (inicio + plazo). Se devuelven por separado.
        - La etapa actual y las recorridas empiezan en su última entrada (el plazo se reinicia en cada reentrada); las
          siguientes, cuando termina la anterior.
        - Un plazo PENDIENTE del cliente no es cero ni SIN_PLAZO: esa etapa y las que dependen de ella quedan
          `SIN_ESTIMAR` y la etapa aparece en `faltantes`. SIN_PLAZO (A1, Fin) no añade duración.
        - El cálculo se retoma desde la etapa de llegada (ADR-0018) si hay llegada real o estimada; la real prevalece y
          se indica la procedencia.
        - `totalDias` (días corridos de la fecha del pedido a la llegada, como la métrica del PRD) y
          `diferenciaContraMeta` solo existen si se conoce la llegada (`calculable: true`); nunca con duraciones
          faltantes.
        - Feriados y jornada laboral: pendientes del cliente; no se descuentan.

        Visibilidad: la de leer el pedido (P-13, provisional del equipo); 403 para cuentas inactivas o sin roles.
      responses:
        '200':
          description: Cronograma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cronograma'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

