        Requisito 4.2 #7: cada etapa tiene observaciones. Los archivos se suben antes y se referencian por id.
        **P-19, provisional del equipo (2026-10-15), pendiente del cliente:**
        - La agrega quien puede actuar en la etapa actual según P-06, o el admin. Se decide con el estado, los roles y
          la asignación vigentes en la base. `consulta` y `asistente_china` no conceden escritura ni quitan la que dan
          otros roles.
        - Solo sobre la entrada actual de la etapa actual (P-18): si `etapaEsperada` o `entradaEsperadaId` ya no son
          los vigentes, 409 ETAPA_CAMBIO.
        - `adjuntoIds` sigue las mismas validaciones que en las acciones: archivos de este pedido, de esta etapa y de
          la entrada actual, presentes y con su huella; un identificador inválido se rechaza, nunca se ignora.
        - Queda en el historial (OBSERVACION_AGREGADA) con actor, rol de intervención y hora del servidor. No avanza
          la etapa, no reinicia plazos ni cambia la versión del pedido.
        - Cambio no compatible respecto de 0.6: `etapaEsperada` y `entradaEsperadaId` pasan a ser obligatorios.
