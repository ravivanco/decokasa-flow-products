      description: |
        Solo propietario, con permisos vigentes. La sesión en recepción exige todavía la misma entrada actual;
        una sesión completada exige poder consultar el pedido. Un admin no retoma cargas ajenas por su rol.
        Sin rutas de disco o credenciales. Cache-Control no-store. No implica una copia en Drive.
      responses:
