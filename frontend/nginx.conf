# nginx del frontend de Decokasa (paso 1.4): sirve el build de Vite y envía /api al backend,
# igual que el proxy de vite.config.ts en desarrollo. Así el navegador no hace llamadas entre orígenes.
# Es una plantilla: el contenedor reemplaza ${ARCHIVOS_CUERPO_MAXIMO_MIB} al arrancar (ver frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # API: "backend" es el nombre del servicio en docker-compose.yml.
    # Las cabeceras de seguridad de la API las pone el backend (SeguridadWebConfig); nginx no las repite.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Límite provisional del equipo, pendiente del cliente: archivo de ARCHIVOS_TAMANO_MAXIMO_MIB (100 MiB por
        # defecto) más 1 MiB para el resto del formulario multipart, el mismo margen que el backend. Lo que lo supera
        # se responde aquí con el formato Problema del contrato. Sin buffer: el archivo pasa directo al backend en vez
        # de copiarse antes al disco de nginx. Los tiempos de espera quedan en sus valores por defecto.
        client_max_body_size ${ARCHIVOS_CUERPO_MAXIMO_MIB}m;
        proxy_request_buffering off;
        error_page 413 @archivo_demasiado_grande;
    }

    location @archivo_demasiado_grande {
        default_type application/problem+json;
        return 413 '{"title":"Archivo demasiado grande","status":413,"detail":"El archivo supera el tamaño máximo permitido.","codigo":"ARCHIVO_DEMASIADO_GRANDE"}';
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rutas de React Router: cualquier ruta desconocida carga index.html.
    # CSP (M4, paso 1.8): el token de acceso vive en memoria, así que un XSS equivale a robar la sesión. Solo scripts,
    # conexiones y fuentes del mismo origen; sin eval ni scripts en línea. style-src permite 'unsafe-inline' porque
    # sonner y el bloqueo de scroll de los diálogos (Radix) insertan etiquetas <style>; no permite ejecutar código.
    # Si se define VITE_API_URL con otro origen, hay que agregarlo a connect-src (ver frontend/.env.example).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
